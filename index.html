// ─── Firebase RTDB hook (falls back to localStorage when FB not configured) ───
const useRTDB = (key, init) => {
  const [v, sv] = useState(() => {
    try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : init; } catch { return init; }
  });
  const skipWrite = useRef(false); // prevent echo-write on remote update
  const seeded = useRef(false); // becomes true after the first snapshot is processed

  useEffect(() => {
    if (!FB_READY) return;
    const db = firebase.database();
    const ref = db.ref("travel_desk/" + key);

    // Listen for remote changes
    const unsub = ref.on("value", (snap) => {
      const data = snap.val();
      if (data !== null) {
        skipWrite.current = true;
        sv(data);
      } else if (!seeded.current) {
        // Truly the first time this node has ever been touched: seed it.
        ref.set(init);
      } else {
        // The node is empty because the user deleted everything, not because
        // it's uninitialized. RTDB stores empty arrays/objects as null, so we
        // must respect that as "intentionally empty" instead of reseeding.
        skipWrite.current = true;
        sv(Array.isArray(init) ? [] : {});
      }
      seeded.current = true;
    });

    return () => ref.off("value", unsub);
  }, [key]);

  // Write to Firebase (and localStorage as backup) when state changes
  useEffect(() => {
    localStorage.setItem(key, JSON.stringify(v));
    if (!FB_READY) return;
    if (skipWrite.current) { skipWrite.current = false; return; }
    firebase.database().ref("travel_desk/" + key).set(v);
  }, [key, v]);

  return [v, sv];
};

    if (resendCooldown <= 0) return;

    return () => clearTimeout(t);
  }, [resendCooldown]);

  const maskMobile = (m) => m ? m.slice(0,2) + "XXXXXX" + m.slice(-2) : "XXXXXXXX";

  const handleVerifyEmpId = () => {
    setErr("");
    const d = drivers.find(x => x.empId === empId.trim());
    if (!d) { setErr("Employee ID not registered in the system."); return; }
    if (!d.active) { setErr("Your access has been deactivated. Please contact Admin."); return; }
    if (!d.mobile || d.mobile.replace(/\D/g,"").length < 10) { setErr("No valid registered mobile number on file. Please contact Admin."); return; }
    sendOTP(d);
  };

  const sendOTP = (d) => {
    setErr("");
    setInfo("");
    setSending(true);
    // 🔧 DEMO MODE: no real SMS is sent. A fake code is generated locally and
    // shown on screen so the login flow can be tested without an SMS provider.
    setTimeout(() => {
      const code = generateFakeOTP();
      otpCodeRef.current = code;
      setOtpStore({ maskedMobile: maskMobile(d.mobile), driverId: d.id });
      setOtpInput("");
      setStep("otp");
      setResendCooldown(30);
      setSending(false);
      setInfo(`Demo mode — your OTP is ${code}`);
    }, 400);
  };

  const handleVerifyOTP = () => {
    setErr("");
    if (!otpCodeRef.current || !otpStore) {
      setErr("Your session expired. Please request a new OTP.");
      setStep("empid");
      return;
    }
    setVerifying(true);
    // 🔧 DEMO MODE: compares against the fake code generated in sendOTP above.
    setTimeout(() => {
      if (otpInput.trim() === otpCodeRef.current) {
        const d = drivers.find(x => x.id === otpStore.driverId);
        const loginEntry = { ts: new Date().toLocaleString(), empId: d.empId };
        setDrivers(prev => prev.map(x => x.id === d.id

        setVerifying(false);
        onLogin({ role:"driver", name:d.name, driverId:d.id, empId:d.empId, loginTime: Date.now() });

        setVerifying(false);

              {info && <div style={{ fontSize:12, color:"#1D4ED8", marginTop:6, fontWeight:700 }}>{info}</div>}

                value={otpInput}
                onChange={e=>setOtpInput(e.target.value.replace(/\D/g,"").slice(0,6))}
                onKeyDown={e=>e.key==="Enter"&&handleVerifyOTP()}
                style={{ ...C.input, letterSpacing:6, fontSize:20, textAlign:"center", fontWeight:700 }}
                maxLength={6}
              />
            </FormField>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginTop:8 }}>
              <button
                style={{ background:"none", border:"none", fontSize:12, cursor:resendCooldown>0?"default":"pointer", color:resendCooldown>0?"#94A3B8":"#2E7CF6", fontWeight:600 }}

                disabled={resendCooldown>0}
              >
                {resendCooldown > 0 ? `Resend OTP in ${resendCooldown}s` : "Resend OTP"}
              </button>
              <button style={{ background:"none", border:"none", fontSize:12, cursor:"pointer", color:"#64748B" }} onClick={resetDriverFlow}>← Change ID</button>
            </div>

          </>

// ─── Dashboard ─────────────────────────────────────────────────────────────────
function Dashboard({ vehicles, drivers, trips, docs }) {
  const alerts = useMemo(() => {
    const out = [];
    vehicles.forEach(v => {
      [["ownDamageExpiry","OD Insurance"],["thirdPartyExpiry","TP Insurance"],["pucExpiry","PUC"],["fitnessExpiry","Fitness"],["roadTaxExpiry","Road Tax"],["permitExpiry","Permit"]].forEach(([k,label]) => {
        const days = daysUntil(v[k]);
        if (days < 0) out.push({ type:"danger", msg:`${v.number}: ${label} expired ${Math.abs(days)} days ago` });
        else if (days <= 30) out.push({ type:"warn", msg:`${v.number}: ${label} expires in ${days} days` });
      });
    });
    drivers.forEach(d => {
      const days = daysUntil(d.licenseExpiry);
      if (days < 0) out.push({ type:"danger", msg:`${d.name}: License expired ${Math.abs(days)} days ago` });
      else if (days <= 60) out.push({ type:"warn", msg:`${d.name}: License expires in ${days} days` });
    });
    return out.slice(0,8);
  }, [vehicles, drivers]);

  const upcoming = trips.filter(t => t.status === "Approved" || t.status === "Vehicle Assigned" || t.status === "Driver Assigned");
  const active = trips.filter(t => t.status === "Trip Started");

  // Mini bar chart
  const statusCounts = VEHICLE_STATUSES.map(s => ({ label:s, count:vehicles.filter(v=>v.status===s).length }));
  const maxCount = Math.max(...statusCounts.map(x=>x.count), 1);

  return (
    <div>
      <div style={C.statsGrid}>
        <Stat label="Total Vehicles" value={vehicles.length} accent="#2E7CF6"/>
        <Stat label="Active" value={vehicles.filter(v=>v.status==="Active").length} accent="#10B981"/>
        <Stat label="Inactive" value={vehicles.filter(v=>v.status==="Inactive").length} accent="#6B7280"/>
        <Stat label="Under Maintenance" value={vehicles.filter(v=>v.status==="Under Maintenance").length} accent="#F59E0B"/>
        <Stat label="Total Drivers" value={drivers.length} accent="#8B5CF6"/>
        <Stat label="Available Drivers" value={drivers.filter(d=>d.status==="Available").length} accent="#10B981"/>
        <Stat label="Active Trips" value={active.length} accent="#EF4444"/>
        <Stat label="Upcoming Trips" value={upcoming.length} accent="#EC4899"/>
      </div>

      <div style={C.sectionGrid}>
        {/* Alerts */}
        <div style={{ ...C.tableWrap }}>
          <div style={C.tableHeader}><span style={C.tableTitle}>🔔 Expiry Alerts</span></div>
          <div style={{ padding:"12px 16px", maxHeight:260, overflowY:"auto" }}>
            {alerts.length === 0 && <p style={C.emptyState}>No alerts — all documents current!</p>}
            {alerts.map((a,i) => <Alert key={i} type={a.type}>{a.msg}</Alert>)}
          </div>
        </div>
        {/* Vehicle Fleet Status */}
        <div style={C.tableWrap}>
          <div style={C.tableHeader}><span style={C.tableTitle}>Fleet Status</span></div>
          <div style={{ padding:"16px 20px" }}>
            {statusCounts.map(({ label, count }) => (

                <div style={{ background:"#F1F5F9", borderRadius:4, height:8, overflow:"hidden" }}>
                  <div style={{ width:`${(count/maxCount)*100}%`, height:"100%", background:statusColor(label), borderRadius:4, transition:"width .4s" }}/>

function Vehicles({ vehicles, setVehicles, drivers }) {
  const [modal, setModal] = useState(null);
  const [search, setSearch] = useState("");
  const [filterType, setFilterType] = useState("");
  const [filterStatus, setFilterStatus] = useState("");

  const filtered = vehicles.filter(v => {
    const q = search.toLowerCase();
    return (!q || v.number.toLowerCase().includes(q) || v.make.toLowerCase().includes(q) || v.model.toLowerCase().includes(q))
      && (!filterType || v.type === filterType)
      && (!filterStatus || v.status === filterStatus);
  });

  const save = (v) => {
    setVehicles(p => p.find(x=>x.id===v.id) ? p.map(x=>x.id===v.id?v:x) : [...p,v]);
    setModal(null);
  };

  const del = (id) => { if (window.confirm("Delete vehicle?")) setVehicles(p=>p.filter(x=>x.id!==id)); };

  const getDriver = (dId) => drivers.find(d => d.id === dId);

  const expiryWarn = (v) => {
    const fields = ["ownDamageExpiry","thirdPartyExpiry","pucExpiry","fitnessExpiry","roadTaxExpiry","permitExpiry"];
    return fields.some(k => { const days = daysUntil(v[k]); return days >= 0 && days <= 30; });
  };

  return (
    <div>
      <div style={C.tableWrap}>
        <div style={C.tableHeader}>
          <span style={C.tableTitle}>Vehicle Fleet ({filtered.length})</span>
          <button style={C.btn("primary")} onClick={() => setModal({ mode:"add" })}><Icon n="plus" size={16} color="#fff"/> Add Vehicle</button>
        </div>
        <div style={C.filterRow}>
          <SearchBox value={search} onChange={setSearch} placeholder="Search by number, make, model…"/>
          <select style={{ ...C.select, minWidth:130, width:"auto" }} value={filterType} onChange={e=>setFilterType(e.target.value)}>
            <option value="">All Types</option>
            {VEHICLE_TYPES.map(t=><option key={t}>{t}</option>)}
          </select>
          <select style={{ ...C.select, minWidth:150, width:"auto" }} value={filterStatus} onChange={e=>setFilterStatus(e.target.value)}>
            <option value="">All Statuses</option>
            {VEHICLE_STATUSES.map(s=><option key={s}>{s}</option>)}
          </select>
        </div>
        <div style={{ overflowX:"auto" }}>
          <table style={C.table}>
            <thead><tr>
              {["Number","Type","Make / Model","Capacity","Fuel","Driver","Status","OD Insurance","TP Insurance","PUC","Actions"].map(h=><th key={h} style={C.th}>{h}</th>)}
            </tr></thead>
            <tbody>
              {filtered.length === 0 && <tr><td colSpan={10} style={{ ...C.td, ...C.emptyState }}>No vehicles found</td></tr>}
              {filtered.map(v => {
                const drv = getDriver(v.driverId);
                return (
                  <tr key={v.id} style={{ background: expiryWarn(v) ? "#FFFBEB" : "" }}>
                    <td style={C.td}><strong style={{ color:"#0F1C2E" }}>{v.number}</strong></td>
                    <td style={C.td}>{v.type}</td>
                    <td style={C.td}>{v.make} {v.model}</td>
                    <td style={C.td}>{v.capacity}</td>
                    <td style={C.td}>{v.fuel}</td>
                    <td style={C.td}>{drv ? <span style={{ fontSize:12 }}>{drv.name}</span> : <span style={{ color:"#94A3B8" }}>Unassigned</span>}</td>
                    <td style={C.td}><Badge status={v.status}/></td>
                    <td style={C.td}><span style={C.chip(statusColor(expiryStatus(v.ownDamageExpiry)))}>{fmtDate(v.ownDamageExpiry)}</span></td>
                    <td style={C.td}><span style={C.chip(statusColor(expiryStatus(v.thirdPartyExpiry)))}>{fmtDate(v.thirdPartyExpiry)}</span></td>
                    <td style={C.td}><span style={C.chip(statusColor(expiryStatus(v.pucExpiry)))}>{fmtDate(v.pucExpiry)}</span></td>
                    <td style={C.td}>
                      <div style={C.row}>
                        <button style={{ ...C.iconBtn, color:"#2E7CF6" }} title="Edit" onClick={() => setModal({ mode:"edit", vehicle:v })}><Icon n="edit" size={16} color="#2E7CF6"/></button>
                        <button style={{ ...C.iconBtn }} title="Delete" onClick={() => del(v.id)}><Icon n="trash" size={16} color="#EF4444"/></button>
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>

      {modal && (
        <Modal title={modal.mode==="add"?"Add New Vehicle":"Edit Vehicle"} onClose={() => setModal(null)} wide>
          <VehicleForm vehicle={modal.vehicle} drivers={drivers} onSave={save} onClose={() => setModal(null)}/>
        </Modal>
      )}
    </div>
  );
}

const VEHICLE_VIEW_DOC_TYPES = ALL_DOC_TYPES_ORDERED.filter(t => t !== "Trip Sheet Scan");

function VehicleDocCard({ vehicle, docs, onUpload, onView, onDelete }) {
  const [collapsed, setCollapsed] = useState(true);
  const vDocs = docs.filter(d => d.vehicleId === vehicle.id);
  const getDoc = (type) => vDocs.find(d => d.type === type);
  const expiredCount = vDocs.filter(d => d.expiryDate && expiryStatus(d.expiryDate) === "Expired").length;
  const expiringSoonCount = vDocs.filter(d => d.expiryDate && expiryStatus(d.expiryDate) === "Expiring Soon").length;

  return (
    <div style={{ background:"#fff", borderRadius:10, boxShadow:"0 1px 4px rgba(0,0,0,.08)", overflow:"hidden", marginBottom:16 }}>
      {/* Card header — click to toggle */}
      <div
        style={{ background:"#0F1C2E", padding:"12px 16px", display:"flex", alignItems:"center", justifyContent:"space-between", cursor:"pointer", userSelect:"none" }}
        onClick={() => setCollapsed(c => !c)}
      >
        <div style={{ display:"flex", alignItems:"center", gap:10 }}>
          <Icon n="vehicle" size={18} color="#2E7CF6"/>
          <div>
            <div style={{ color:"#fff", fontWeight:700, fontSize:14 }}>{vehicle.number}</div>
            <div style={{ color:"#94A3B8", fontSize:11 }}>{vehicle.make} {vehicle.model} · {vehicle.type}</div>
          </div>
          {/* doc summary badges */}
          <div style={{ display:"flex", gap:6, marginLeft:8 }}>
            <span style={{ fontSize:11, background:"rgba(255,255,255,0.12)", color:"#CBD5E1", borderRadius:12, padding:"2px 8px" }}>{vDocs.length} docs</span>
            {expiredCount > 0 && <span style={{ fontSize:11, background:"#EF4444", color:"#fff", borderRadius:12, padding:"2px 8px" }}>{expiredCount} expired</span>}
            {expiringSoonCount > 0 && <span style={{ fontSize:11, background:"#F59E0B", color:"#fff", borderRadius:12, padding:"2px 8px" }}>{expiringSoonCount} expiring</span>}
          </div>
        </div>
        <div style={{ display:"flex", alignItems:"center", gap:8 }}>
          <span style={C.badge(statusColor(vehicle.status))}>{vehicle.status}</span>
          <button style={{ ...C.btn("primary"), padding:"5px 12px", fontSize:12 }} onClick={e => { e.stopPropagation(); onUpload(vehicle.id); }}>
            <Icon n="plus" size={13} color="#fff"/> Add Doc
          </button>
          {/* chevron */}
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{ transition:"transform 0.2s", transform: collapsed ? "rotate(0deg)" : "rotate(180deg)" }}>
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </div>
      </div>
      {/* Document grid — hidden when collapsed */}
      {!collapsed && <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(160px,1fr))", gap:1, background:"#E2E8F0" }}>
        {VEHICLE_VIEW_DOC_TYPES.map(type => {
          const doc = getDoc(type);
          const s = doc ? (doc.expiryDate ? expiryStatus(doc.expiryDate) : "Valid") : null;
          const col = s ? statusColor(s) : "#D1D5DB";
          return (
            <div key={type} style={{ background:"#fff", padding:"12px 14px", display:"flex", flexDirection:"column", gap:6, minHeight:90 }}>
              <div style={{ fontSize:11, fontWeight:700, color:"#64748B", textTransform:"uppercase", letterSpacing:"0.4px" }}>{type}</div>
              {doc ? (
                <>
                  <div style={{ fontSize:12, fontWeight:600, color:"#0F1C2E", flex:1, lineHeight:1.3 }}>{doc.name}</div>
                  {doc.expiryDate && <div style={C.chip(col)}>{fmtDate(doc.expiryDate)}</div>}
                  {!doc.expiryDate && <div style={{ fontSize:11, color:"#94A3B8" }}>No expiry</div>}
                  <div style={{ display:"flex", gap:4, marginTop:2 }}>
                    {doc.fileData && <button style={{ ...C.iconBtn, background:"#EFF6FF", borderRadius:4, padding:"3px 7px" }} title="View scan" onClick={() => onView(doc)}><Icon n="eye" size={13} color="#2E7CF6"/></button>}
                    {!doc.fileData && <span style={{ fontSize:10, color:"#F59E0B", fontStyle:"italic" }}>No scan</span>}
                    <button style={{ ...C.iconBtn, background:"#FFF7ED", borderRadius:4, padding:"3px 7px" }} title="Delete" onClick={() => onDelete(doc.id)}><Icon n="trash" size={13} color="#EF4444"/></button>
                  </div>
                </>
              ) : (
                <div style={{ flex:1, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:4 }}>
                  <div style={{ width:28, height:28, borderRadius:99, background:"#F1F5F9", display:"flex", alignItems:"center", justifyContent:"center" }}>
                    <Icon n="plus" size={14} color="#94A3B8"/>
                  </div>
                  <div style={{ fontSize:10, color:"#94A3B8" }}>Not uploaded</div>
                  <button style={{ fontSize:10, color:"#2E7CF6", background:"none", border:"none", cursor:"pointer", padding:0 }} onClick={() => onUpload(vehicle.id, type)}>Upload</button>
                </div>
              )}
            </div>
          );
        })}
      </div>}
    </div>
  );
}

function Documents({ docs, setDocs, vehicles }) {
  const [modal, setModal] = useState(null); // "add"|"edit"|"view"
  const [viewDoc, setViewDoc] = useState(null);
  const [filterVehicle, setFilterVehicle] = useState("");
  const [viewMode, setViewMode] = useState("vehicle"); // "vehicle"|"table"
  const [search, setSearch] = useState("");
  const [filterType, setFilterType] = useState("");
  const [filterFrom, setFilterFrom] = useState("");
  const [filterTo, setFilterTo] = useState("");
  const [uploading, setUploading] = useState(false);

  const blank = () => ({ id:"DOC"+uid(), vehicleId:"", name:"", type:"Insurance", uploadDate:today(), expiryDate:"", status:"Valid", fileName:"", fileData:"" });
  const [f, setF] = useState(blank());
  const fSet = (k,v) => setF(p=>({...p,[k]:v}));

  const openAdd = (vehicleId="", type="") => {
    setF({ ...blank(), vehicleId, type: type || "Insurance" });
    setModal("add");
  };

  const handleFileChange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setUploading(true);
    const reader = new FileReader();
    reader.onload = (ev) => {
      fSet("fileData", ev.target.result);
      fSet("fileName", file.name);
      setUploading(false);
    };
    reader.readAsDataURL(file);
  };

  const save = () => {
    if (!f.vehicleId || !f.name) return alert("Vehicle and document name required");
    const withStatus = { ...f, status: f.expiryDate ? expiryStatus(f.expiryDate) : "Valid" };
    setDocs(p => p.find(x=>x.id===f.id) ? p.map(x=>x.id===f.id?withStatus:x) : [...p,withStatus]);
    setModal(null);
  };

  const del = (id) => { if (window.confirm("Delete document?")) setDocs(p=>p.filter(x=>x.id!==id)); };

  const filtered = docs.filter(d => {
    const q = search.toLowerCase();
    return (!q || d.name.toLowerCase().includes(q))
      && (!filterVehicle || d.vehicleId === filterVehicle)
      && (!filterType || d.type === filterType)
      && (!filterFrom || (d.uploadDate && d.uploadDate >= filterFrom))
      && (!filterTo || (d.uploadDate && d.uploadDate <= filterTo));
  });

  const getVehicle = (vid) => vehicles.find(v=>v.id===vid);
  const displayedVehicles = filterVehicle ? vehicles.filter(v=>v.id===filterVehicle) : vehicles;

  return (
    <div>
      <div style={{ ...C.tableWrap, marginBottom:16 }}>
        <div style={C.tableHeader}>
          <span style={C.tableTitle}>Vehicle Documents</span>
          <div style={C.row}>
            {/* View toggle */}
            <div style={{ display:"flex", border:"1px solid #E2E8F0", borderRadius:7, overflow:"hidden" }}>
              {[["vehicle","Vehicle View"],["table","Table View"]].map(([v,label]) => (
                <button key={v} style={{ padding:"6px 14px", fontSize:12, fontWeight:600, border:"none", cursor:"pointer", background:viewMode===v?"#2E7CF6":"#fff", color:viewMode===v?"#fff":"#64748B" }} onClick={() => setViewMode(v)}>{label}</button>
              ))}
            </div>
            <button style={C.btn("primary")} onClick={() => openAdd()}><Icon n="plus" size={16} color="#fff"/> Upload Document</button>
          </div>
        </div>
        <div style={C.filterRow}>
          <SearchBox value={search} onChange={setSearch} placeholder="Search document name…"/>
          <select style={{ ...C.select, minWidth:160, width:"auto" }} value={filterVehicle} onChange={e=>setFilterVehicle(e.target.value)}>
            <option value="">All Vehicles</option>
            {vehicles.map(v=><option key={v.id} value={v.id}>{v.number}</option>)}
          </select>
          {viewMode === "table" && (
            <select style={{ ...C.select, minWidth:160, width:"auto" }} value={filterType} onChange={e=>setFilterType(e.target.value)}>
              <option value="">All Types</option>
              {ALL_DOC_TYPES_ORDERED.map(t=><option key={t}>{t}</option>)}
            </select>
          )}
          {viewMode === "table" && (
            <div style={{ display:"flex", gap:8, alignItems:"center", marginLeft:"auto" }}>
              <span style={{ fontSize:12, color:"#64748B" }}>From:</span>
              <input type="date" style={{ ...C.input, padding:"6px 10px" }} value={filterFrom} onChange={e=>setFilterFrom(e.target.value)}/>
              <span style={{ fontSize:12, color:"#64748B" }}>To:</span>
              <input type="date" style={{ ...C.input, padding:"6px 10px" }} value={filterTo} onChange={e=>setFilterTo(e.target.value)}/>
              {(filterFrom || filterTo) && (
                <button style={{ ...C.btn("ghost"), padding:"6px 10px", fontSize:12 }} onClick={()=>{setFilterFrom("");setFilterTo("");}}>Clear</button>
              )}
            </div>
          )}
        </div>
      </div>

      {/* ── Vehicle Card View ─────────────────────────────────────────── */}
      {viewMode === "vehicle" && (
        <div>
          {displayedVehicles.length === 0 && <div style={{ ...C.emptyState, background:"#fff", borderRadius:10, padding:48 }}>No vehicles found</div>}
          {displayedVehicles.map(v => (
            <VehicleDocCard
              key={v.id}
              vehicle={v}
              docs={docs}
              onUpload={(vid, type) => openAdd(vid, type)}
              onView={(doc) => { setViewDoc(doc); setModal("view"); }}
              onDelete={del}
            />
          ))}
        </div>
      )}

      {/* ── Table View ───────────────────────────────────────────────── */}
      {viewMode === "table" && (
        <div style={C.tableWrap}>
          <div style={{ overflowX:"auto" }}>
            <table style={C.table}>

function TripForm({ trip, vehicles, drivers, onSave, onClose }) {
  const defaultF = { id:"T"+uid(), sheetNo:"", vehicleType:"", vehicleId:"", driverId:"", passengerName:"", pickup:"", destination:"", purpose:"", date:"", startTime:"08:00", startKms:"", closeTime:"", closeKms:"", totalKms:"", totalTime:"", remarks:"", status:"Requested", requestedBy:"Admin", createdAt:today() };

  const set = (k,v) => setF(p=>({...p,[k]:v}));

  // Auto-compute totals
  const handleKms = (k,v) => {
    const updated = {...f,[k]:v};
    if (updated.startKms && updated.closeKms) {
      const diff = Number(updated.closeKms) - Number(updated.startKms);
      if (diff >= 0) updated.totalKms = diff;
    }
    setF(updated);
  };

  const selectedVehicle = vehicles.find(v => v.id === f.vehicleId);

  return (
    <div style={C.form}>
      {/* Header info */}

        </FormField>
        <FormField label="Vehicle (Number Plate) *">
          <Sel value={f.vehicleId} onChange={e=>{ set("vehicleId",e.target.value); const v=vehicles.find(x=>x.id===e.target.value); if(v) setF(p=>({...p,vehicleId:e.target.value,vehicleType:v.type})); }} options={[{value:"",label:"— Select —"},...vehicles.map(v=>({value:v.id,label:`${v.number} (${v.type})`}))]}/>
        </FormField>
        <FormField label="Driver's Name *">

          <Inp value={f.pickup} onChange={e=>set("pickup",e.target.value)} placeholder="GITAM Campus"/>

        </FormField>
        <FormField label="Requested By">
          <Inp value={f.requestedBy} onChange={e=>set("requestedBy",e.target.value)}/>
        </FormField>
      </div>

      {/* Trip log table — mirrors physical form */}
      <div style={{ border:"1px solid #D1D5DB", borderRadius:8, overflow:"hidden", marginBottom:16 }}>

        <div style={{ overflowX:"auto" }}>
          <table style={{ width:"100%", borderCollapse:"collapse" }}>

  );

            <thead><tr>

            </tr></thead>
            <tbody>
              {filtered.length===0 && <tr><td colSpan={11} style={{ ...C.td, textAlign:"center", color:"#94A3B8" }}>No trip sheets found</td></tr>}
              {filtered.map(t => {
                const v = getV(t.vehicleId);
                const d = getD(t.driverId);
                return (
                  <tr key={t.id}>
                    <td style={C.td}><span style={{ fontFamily:"monospace", fontSize:12, color:"#2E7CF6", fontWeight:700 }}>{t.sheetNo || t.id}</span></td>
                    <td style={C.td}><span style={{ fontSize:12 }}>{fmtDate(t.date)}<br/><span style={{ color:"#64748B", fontSize:11 }}>{t.startTime} – {t.closeTime}</span></span></td>
                    <td style={C.td}><span style={{ fontSize:12 }}>{t.vehicleType}<br/><span style={{ color:"#2E7CF6", fontSize:11, fontWeight:500 }}>{v ? v.number : "—"}</span></span></td>
                    <td style={C.td}><span style={{ fontSize:12 }}>{d ? d.name : <span style={{ color:"#94A3B8" }}>—</span>}</span></td>
                    <td style={C.td}><span style={{ fontSize:12 }}>{t.passengerName || "—"}</span></td>
                    <td style={C.td}><span style={{ fontSize:12 }}>{t.pickup}<br/>→ {t.destination}</span></td>
                    <td style={C.td}>{t.startKms || "—"}</td>
                    <td style={C.td}>{t.closeKms || "—"}</td>
                    <td style={C.td}><strong style={{ color:"#15803D" }}>{t.totalKms || "—"}</strong></td>
                    <td style={C.td}><Badge status={t.status}/></td>
                    <td style={C.td}>
                      <div style={C.row}>
                        {t.status === "Requested" && <button style={{ ...C.btn("success"), padding:"4px 10px", fontSize:11 }} onClick={() => quickStatus(t,"Approved")}><Icon n="check" size={12} color="#fff"/>Approve</button>}
                        {t.status === "Approved" && <button style={{ ...C.btn("primary"), padding:"4px 10px", fontSize:11 }} onClick={() => quickStatus(t,"Trip Started")}>Start</button>}
                        {t.status === "Trip Started" && <button style={{ ...C.btn("ghost"), padding:"4px 10px", fontSize:11 }} onClick={() => quickStatus(t,"Trip Completed")}>End</button>}
                        <button style={C.iconBtn} onClick={() => setModal({ mode:"edit", trip:t })}><Icon n="edit" size={15} color="#2E7CF6"/></button>
                        <button style={C.iconBtn} onClick={() => del(t.id)}><Icon n="trash" size={15} color="#EF4444"/></button>
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
      {modal && (
        <Modal title={modal.mode==="add"?"New Trip Sheet":"Edit Trip Sheet"} onClose={() => setModal(null)} wide>
          <TripForm trip={modal.trip} vehicles={vehicles} drivers={drivers} onSave={save} onClose={() => setModal(null)}/>
        </Modal>
      )}
    </div>
  );
}

// ─── Reports ───────────────────────────────────────────────────────────────────
function Reports({ trips, setTrips, vehicles, drivers }) {
  const [type, setType] = useState("trips");
  const [from, setFrom] = useState("");
  const [to, setTo] = useState("");
  const [selected, setSelected] = useState([]);

  useEffect(() => { setSelected([]); }, [type, from, to]);

  const inRange = (date) => (!from || date >= from) && (!to || date <= to);

  const filtered = trips.filter(t => inRange(t.date));

  const toggleSelect = (id) => setSelected(p => p.includes(id) ? p.filter(x=>x!==id) : [...p, id]);
  const allSelected = filtered.length > 0 && filtered.every(t => selected.includes(t.id));
  const toggleSelectAll = () => setSelected(allSelected ? [] : filtered.map(t => t.id));
  const deleteSelected = () => {
    if (selected.length === 0) return;
    if (window.confirm(`Delete ${selected.length} selected report${selected.length > 1 ? "s" : ""}? This cannot be undone.`)) {
      setTrips(p => p.filter(x => !selected.includes(x.id)));
      setSelected([]);
    }
  };

  const tripByStatus = TRIP_STATUSES.map(s => ({ status:s, count:filtered.filter(t=>t.status===s).length })).filter(x=>x.count>0);

  const vehicleUtil = vehicles.map(v => ({
    number:v.number, type:v.type,
    trips:filtered.filter(t=>t.vehicleId===v.id).length,
    status:v.status
  }));

  const driverUtil = drivers.map(d => ({
    name:d.name, empId:d.empId,
    trips:filtered.filter(t=>t.driverId===d.id).length,
    status:d.status
  }));

  const expiryReport = [];
  vehicles.forEach(v => {
    [["ownDamageExpiry","OD Insurance"],["thirdPartyExpiry","TP Insurance"],["pucExpiry","PUC"],["fitnessExpiry","Fitness"],["roadTaxExpiry","Road Tax"],["permitExpiry","Permit"]].forEach(([k,label]) => {
      if (v[k]) expiryReport.push({ vehicle:v.number, doc:label, expiry:v[k], status:expiryStatus(v[k]), days:daysUntil(v[k]) });
    });
  });

  return (
    <div>
      <div style={{ ...C.tableWrap, marginBottom:16 }}>
        <div style={C.tableHeader}>
          <span style={C.tableTitle}>Reports</span>
          <div style={{ marginLeft:"auto", display:"flex", gap:8 }}>
            {type === "trips" && selected.length > 0 && (
              <button style={{ ...C.btn("ghost"), color:"#EF4444", borderColor:"#FCA5A5" }} onClick={deleteSelected}>
                <Icon n="trash" size={16} color="#EF4444"/> Delete Selected ({selected.length})
              </button>
            )}
            <button style={C.btn("ghost")} onClick={() => alert("Export functionality — in production this generates CSV/PDF")}><Icon n="download" size={16} color="#2E7CF6"/> Export</button>
          </div>
        </div>
        <div style={C.filterRow}>
          <div style={{ display:"flex", gap:6 }}>
            {[["trips","Trip Summary"],["vehicles","Vehicle Utilisation"],["drivers","Driver Utilisation"],["expiry","Document Expiry"]].map(([k,l]) => (
              <button key={k} onClick={() => setType(k)} style={{ padding:"6px 14px", borderRadius:6, border:"1px solid", borderColor:type===k?"#2E7CF6":"#D1D5DB", background:type===k?"#2E7CF6":"#fff", color:type===k?"#fff":"#374151", fontSize:13, fontWeight:500, cursor:"pointer" }}>{l}</button>
            ))}
          </div>
          <div style={{ marginLeft:"auto", display:"flex", gap:8, alignItems:"center" }}>
            <span style={{ fontSize:12, color:"#64748B" }}>From:</span>
            <input type="date" style={{ ...C.input, padding:"6px 10px" }} value={from} onChange={e=>setFrom(e.target.value)}/>
            <span style={{ fontSize:12, color:"#64748B" }}>To:</span>
            <input type="date" style={{ ...C.input, padding:"6px 10px" }} value={to} onChange={e=>setTo(e.target.value)}/>
          </div>
        </div>
      </div>

      {type === "trips" && (
        <div style={C.tableWrap}>
          <div style={{ padding:"12px 20px", borderBottom:"1px solid #E2E8F0" }}>
            <div style={{ display:"flex", gap:12, flexWrap:"wrap" }}>
              {tripByStatus.map(x => <div key={x.status} style={{ ...C.statCard(statusColor(x.status)), padding:"12px 18px", minWidth:120 }}><div style={C.statNum}>{x.count}</div><div style={C.statLabel}>{x.status}</div></div>)}
            </div>
          </div>
          <table style={C.table}>
            <thead><tr>
              <th style={{ ...C.th, width:36 }}><input type="checkbox" checked={allSelected} onChange={toggleSelectAll}/></th>
              {["Sheet No.","Date","Vehicle","Driver","Passenger","Route","Total KMS","Status"].map(h=><th key={h} style={C.th}>{h}</th>)}
            </tr></thead>
            <tbody>
              {filtered.length===0 && <tr><td colSpan={9} style={{ ...C.td, textAlign:"center", color:"#94A3B8" }}>No trip sheets in selected range</td></tr>}
              {filtered.map(t => (
                <tr key={t.id} style={selected.includes(t.id) ? { background:"#EFF6FF" } : undefined}>
                  <td style={C.td}><input type="checkbox" checked={selected.includes(t.id)} onChange={() => toggleSelect(t.id)}/></td>
                  <td style={C.td}><span style={{ fontFamily:"monospace", fontSize:12, color:"#2E7CF6", fontWeight:700 }}>{t.sheetNo || t.id}</span></td>
                  <td style={C.td}>{fmtDate(t.date)}</td>
                  <td style={C.td}>{vehicles.find(v=>v.id===t.vehicleId)?.number || "—"}</td>
                  <td style={C.td}>{drivers.find(d=>d.id===t.driverId)?.name || "—"}</td>
                  <td style={C.td}>{t.passengerName || "—"}</td>
                  <td style={C.td}><span style={{ fontSize:12 }}>{t.pickup} → {t.destination}</span></td>
                  <td style={C.td}><strong style={{ color:"#15803D" }}>{t.totalKms || "—"}</strong></td>
                  <td style={C.td}><Badge status={t.status}/></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}

      {type === "vehicles" && (
        <div style={C.tableWrap}>
          <table style={C.table}>
            <thead><tr>{["Vehicle No.","Type","Status","Trips Completed"].map(h=><th key={h} style={C.th}>{h}</th>)}</tr></thead>
            <tbody>
              {vehicleUtil.map(v => (
                <tr key={v.number}>
                  <td style={C.td}><strong>{v.number}</strong></td>
                  <td style={C.td}>{v.type}</td>
                  <td style={C.td}><Badge status={v.status}/></td>
                  <td style={C.td}><strong style={{ color:"#2E7CF6" }}>{v.trips}</strong></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}

      {type === "drivers" && (
        <div style={C.tableWrap}>
          <table style={C.table}>
            <thead><tr>{["Emp ID","Name","Status","Trips Handled"].map(h=><th key={h} style={C.th}>{h}</th>)}</tr></thead>
            <tbody>
              {driverUtil.map(d => (
                <tr key={d.empId}>
                  <td style={C.td}><span style={{ fontFamily:"monospace", color:"#2E7CF6" }}>{d.empId}</span></td>
                  <td style={C.td}><strong>{d.name}</strong></td>
                  <td style={C.td}><Badge status={d.status}/></td>
                  <td style={C.td}><strong style={{ color:"#2E7CF6" }}>{d.trips}</strong></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}

      {type === "expiry" && (
        <div style={C.tableWrap}>
          <table style={C.table}>
            <thead><tr>{["Vehicle","Document","Expiry Date","Days Left","Status"].map(h=><th key={h} style={C.th}>{h}</th>)}</tr></thead>
            <tbody>
              {expiryReport.sort((a,b)=>a.days-b.days).map((r,i) => (
                <tr key={i} style={{ background:r.status==="Expired"?"#FEF2F2":r.status==="Expiring Soon"?"#FFFBEB":"" }}>
                  <td style={C.td}><strong>{r.vehicle}</strong></td>
                  <td style={C.td}>{r.doc}</td>
                  <td style={C.td}>{fmtDate(r.expiry)}</td>
                  <td style={C.td}><span style={{ fontWeight:700, color:r.days<0?"#EF4444":r.days<=30?"#F59E0B":"#10B981" }}>{r.days < 0 ? `${Math.abs(r.days)} days ago` : `${r.days} days`}</span></td>
                  <td style={C.td}><Badge status={r.status}/></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

// ─── Driver Documents View (read-only, mirrors Admin Documents tab) ────────────
function DriverDocumentsView({ docs, vehicles, assignedVehicleId }) {
  const [search, setSearch] = useState("");
  const [filterType, setFilterType] = useState("");
  const [viewDoc, setViewDoc] = useState(null);

  const ALL_DOC_TYPES_ORDERED = ["Registration Certificate","Insurance","PUC","Fitness","Road Tax","Vehicle Permit","Driver License","Trip Sheet Scan","Other"];

  // Show docs for ALL vehicles
  const assignedVehicle = vehicles.find(v => v.id === assignedVehicleId);

  const filtered = docs.filter(d => {
    const q = search.toLowerCase();
    const v = vehicles.find(vv => vv.id === d.vehicleId);
    return (!q || d.name.toLowerCase().includes(q) || (v?.number || "").toLowerCase().includes(q))
      && (!filterType || d.type === filterType);
  });

  const getVehicle = (vid) => vehicles.find(v => v.id === vid);

  return (
    <div>
      {assignedVehicleId && (
        <div style={{ background:"#EFF6FF", border:"1px solid #BFDBFE", borderRadius:10, padding:"12px 16px", marginBottom:16, display:"flex", alignItems:"center", gap:10 }}>
          <Icon n="vehicle" size={16} color="#2E7CF6"/>
          <div style={{ fontSize:13, color:"#1D4ED8" }}>
            Your assigned vehicle: <strong>{assignedVehicle?.number} — {assignedVehicle?.make} {assignedVehicle?.model}</strong>
          </div>
        </div>
      )}
      <div style={C.tableWrap}>
        <div style={C.tableHeader}>
          <span style={C.tableTitle}>All Vehicle Documents ({filtered.length})</span>
          <span style={{ fontSize:12, color:"#64748B", background:"#F1F5F9", padding:"4px 10px", borderRadius:6, fontWeight:600 }}>View Only</span>
        </div>
        <div style={C.filterRow}>
          <SearchBox value={search} onChange={setSearch} placeholder="Search document name…"/>
          <select style={{ ...C.select, minWidth:160, width:"auto" }} value={filterType} onChange={e=>setFilterType(e.target.value)}>
            <option value="">All Types</option>
            {ALL_DOC_TYPES_ORDERED.map(t=><option key={t}>{t}</option>)}
          </select>
        </div>
        <div style={{ overflowX:"auto" }}>
          <table style={C.table}>
            <thead><tr>
              {["Vehicle","Document Name","Type","Upload Date","Expiry","Status","Scan"].map(h=><th key={h} style={C.th}>{h}</th>)}
            </tr></thead>
            <tbody>
              {filtered.length===0 && <tr><td colSpan={7} style={{ ...C.td, textAlign:"center", color:"#94A3B8" }}>No documents found</td></tr>}
              {filtered.map(d => {
                const v = getVehicle(d.vehicleId);
                const s = d.expiryDate ? expiryStatus(d.expiryDate) : "Valid";
                return (
                  <tr key={d.id}>
                    <td style={C.td}>{v ? <span style={{ fontWeight:600, color:"#2E7CF6" }}>{v.number}</span> : "—"}</td>
                    <td style={C.td}><div style={{ display:"flex", alignItems:"center", gap:8 }}><Icon n="doc" size={15} color="#64748B"/>{d.name}</div></td>
                    <td style={C.td}><span style={C.chip("#64748B")}>{d.type}</span></td>
                    <td style={C.td}>{fmtDate(d.uploadDate)}</td>
                    <td style={C.td}>{d.expiryDate ? <span style={C.chip(statusColor(s))}>{fmtDate(d.expiryDate)}</span> : <span style={{ color:"#94A3B8" }}>N/A</span>}</td>
                    <td style={C.td}><Badge status={s}/></td>
                    <td style={C.td}>
                      {d.fileData
                        ? <button style={{ ...C.iconBtn, background:"#EFF6FF", borderRadius:5, padding:"4px 10px", fontSize:12, color:"#2E7CF6", fontWeight:600 }} onClick={() => setViewDoc(d)}><Icon n="eye" size={14} color="#2E7CF6"/> View</button>
                        : <span style={{ fontSize:11, color:"#F59E0B", fontWeight:600 }}>Not uploaded</span>}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
      {viewDoc && <DocViewerModal doc={viewDoc} onClose={() => setViewDoc(null)}/>}
    </div>
  );
}

// ─── Driver Trip Sheet ─────────────────────────────────────────────────────────
function DriverTripSheet({ driver, vehicle, trips, setTrips }) {
  const actionable = trips.filter(t => ["Approved","Vehicle Assigned","Driver Assigned","Trip Started","Trip Completed"].includes(t.status));
  const [selected, setSelected] = useState(actionable[0]?.id || null);
  const [editing, setEditing] = useState(false);
  const [form, setForm] = useState({});
  const [saved, setSaved] = useState(false);

  const trip = trips.find(t => t.id === selected);

  const openEdit = (t) => {
    setForm({
      startTime: t.startTime || "",
      startKms: t.startKms || "",
      closeTime: t.closeTime || "",
      closeKms: t.closeKms || "",
      totalTime: t.totalTime || "",
      remarks: t.remarks || "",
    });
    setEditing(true);
    setSaved(false);
  };

  const computeKms = (f) => {
    const s = Number(f.startKms), c = Number(f.closeKms);
    return (s && c && c >= s) ? c - s : null;
  };

  const save = () => {
    const totalKms = computeKms(form);
    let newStatus = trip.status;
    if (trip.status === "Approved" || trip.status === "Vehicle Assigned" || trip.status === "Driver Assigned") {
      if (form.startKms && form.startTime) newStatus = "Trip Started";
    }
    if (trip.status === "Trip Started" && form.closeKms && form.closeTime) {
      newStatus = "Trip Completed";
    }
    setTrips(p => p.map(t => t.id === selected
      ? { ...t, ...form, totalKms: totalKms ?? t.totalKms, status: newStatus }
      : t
    ));
    setEditing(false);
    setSaved(true);
  };

  const fSet = (k, v) => setForm(p => ({ ...p, [k]: v }));

  if (actionable.length === 0) {
    return (
      <div style={{ ...C.tableWrap, padding:40, textAlign:"center" }}>
        <Icon n="trip" size={36} color="#CBD5E1"/>
        <div style={{ marginTop:12, color:"#94A3B8", fontSize:14 }}>No active or upcoming trips assigned to you.</div>
      </div>
    );
  }

  return (
    <div>
      {/* Trip selector */}
      <div style={{ display:"flex", gap:10, marginBottom:16, flexWrap:"wrap" }}>
        {actionable.map(t => (
          <button key={t.id}
            style={{ padding:"8px 14px", borderRadius:8, border:"2px solid", fontSize:13, fontWeight:600, cursor:"pointer",
              borderColor: selected===t.id ? "#2E7CF6" : "#E2E8F0",
              background: selected===t.id ? "#EFF6FF" : "#fff",
              color: selected===t.id ? "#2E7CF6" : "#374151" }}
            onClick={() => { setSelected(t.id); setEditing(false); setSaved(false); }}
          >
            #{t.sheetNo || t.id} · {t.destination}
          </button>
        ))}
      </div>

      {trip && (
        <div style={{ background:"#fff", borderRadius:12, boxShadow:"0 1px 4px rgba(0,0,0,.06)", overflow:"hidden" }}>
          {/* Trip header */}
          <div style={{ background:"#0F1C2E", padding:"16px 24px", display:"flex", justifyContent:"space-between", alignItems:"center", flexWrap:"wrap", gap:10 }}>
            <div>
              <div style={{ color:"#fff", fontWeight:700, fontSize:16 }}>Trip Sheet #{trip.sheetNo || trip.id}</div>
              <div style={{ color:"#94A3B8", fontSize:12, marginTop:2 }}>{fmtDate(trip.date)} · {trip.purpose || "Official Travel"}</div>
            </div>
            <Badge status={trip.status}/>
          </div>

          {/* Trip info grid */}
          <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))", gap:0, borderBottom:"1px solid #E2E8F0" }}>
            {[
              ["Passenger", trip.passengerName || "—"],
              ["From", trip.pickup],
              ["To", trip.destination],
              ["Vehicle", vehicle ? `${vehicle.number} (${vehicle.type})` : trip.vehicleType || "—"],
            ].map(([label, val]) => (
              <div key={label} style={{ padding:"14px 20px", borderRight:"1px solid #F1F5F9" }}>
                <div style={{ fontSize:11, color:"#64748B", marginBottom:3 }}>{label}</div>
                <div style={{ fontSize:13, fontWeight:600, color:"#0F1C2E" }}>{val}</div>
              </div>
            ))}
          </div>

          {/* Trip log section */}
          <div style={{ padding:"20px 24px" }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16 }}>
              <div style={{ fontSize:14, fontWeight:700, color:"#0F1C2E" }}>Trip Log</div>
              {!editing && (
                <button style={C.btn("primary")} onClick={() => openEdit(trip)}>
                  <Icon n="edit" size={14} color="#fff"/> {trip.startKms ? "Update Details" : "Fill Trip Details"}
                </button>
              )}
            </div>

            {saved && !editing && (
              <div style={{ ...C.alertBar("info"), marginBottom:12 }}>
                <Icon n="check" size={15} color="#2E7CF6"/>
                <div style={C.alertText}>Trip details saved successfully.</div>
              </div>
            )}

            {!editing ? (
              /* Read-only view */
              <div style={{ overflowX:"auto" }}>
                <table style={{ ...C.table, border:"1px solid #E2E8F0", borderRadius:8 }}>
                  <thead>
                    <tr style={{ background:"#F8FAFC" }}>
                      {["Start Time","Start KMS","Close Time","Close KMS","Total KMS","Total Time","Remarks"].map(h => (
                        <th key={h} style={{ ...C.th, whiteSpace:"nowrap" }}>{h}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td style={C.td}>{trip.startTime || <span style={{ color:"#CBD5E1" }}>—</span>}</td>
                      <td style={C.td}>{trip.startKms || <span style={{ color:"#CBD5E1" }}>—</span>}</td>
                      <td style={C.td}>{trip.closeTime || <span style={{ color:"#CBD5E1" }}>—</span>}</td>
                      <td style={C.td}>{trip.closeKms || <span style={{ color:"#CBD5E1" }}>—</span>}</td>
                      <td style={{ ...C.td, background:"#F0FDF4" }}>
                        {trip.totalKms ? <strong style={{ color:"#15803D" }}>{trip.totalKms} km</strong> : <span style={{ color:"#CBD5E1" }}>—</span>}
                      </td>
                      <td style={C.td}>{trip.totalTime || <span style={{ color:"#CBD5E1" }}>—</span>}</td>
                      <td style={C.td}>{trip.remarks || <span style={{ color:"#CBD5E1" }}>—</span>}</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            ) : (
              /* Edit form */
              <div>
                <div style={{ background:"#FFF7ED", border:"1px solid #FED7AA", borderRadius:8, padding:"10px 14px", marginBottom:16, fontSize:12, color:"#92400E" }}>
                  <strong>Instructions:</strong> Fill in the trip details below. Entering start details will mark the trip as Started; entering close details will mark it Completed.
                </div>
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:14, marginBottom:14 }}>
                  <FormField label="Start Time">
                    <Inp type="time" value={form.startTime} onChange={e => fSet("startTime", e.target.value)}/>
                  </FormField>
                  <FormField label="Start KMS *">
                    <Inp type="number" value={form.startKms} onChange={e => fSet("startKms", e.target.value)} placeholder="e.g. 75763"/>
                  </FormField>
                  <div/>
                  <FormField label="Close Time">
                    <Inp type="time" value={form.closeTime} onChange={e => fSet("closeTime", e.target.value)}/>
                  </FormField>
                  <FormField label="Close KMS">
                    <Inp type="number" value={form.closeKms} onChange={e => fSet("closeKms", e.target.value)} placeholder="e.g. 75880"/>
                  </FormField>
                  <FormField label="Total KMS">
                    <div style={{ padding:"9px 12px", background:"#F0FDF4", border:"1px solid #D1FAE5", borderRadius:7, fontSize:13, fontWeight:700, color:"#15803D" }}>
                      {computeKms(form) !== null ? `${computeKms(form)} km` : "Auto-calculated"}
                    </div>
                  </FormField>
                  <FormField label="Total Time">
                    <Inp value={form.totalTime} onChange={e => fSet("totalTime", e.target.value)} placeholder="e.g. 7.15 Hours"/>
                  </FormField>
                  <FormField label="Remarks" >
                    <Inp value={form.remarks} onChange={e => fSet("remarks", e.target.value)} placeholder="Optional notes"/>
                  </FormField>
                </div>
                <div style={{ display:"flex", gap:10, justifyContent:"flex-end" }}>
                  <button style={C.btn("ghost")} onClick={() => setEditing(false)}>Cancel</button>
                  <button style={C.btn("primary")} onClick={save}>
                    <Icon n="check" size={14} color="#fff"/> Save Trip Sheet
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

// ─── Driver Trip Sheet Form ────────────────────────────────────────────────────
function DriverTripSheetForm({ driver, vehicle, trips, setTrips, docs, setDocs }) {
  const [selectedTripId, setSelectedTripId] = useState(trips[0]?.id || null);
  const [editing, setEditing] = useState(false);
  const [form, setForm] = useState({});
  const [saved, setSaved] = useState(false);
  const [scanUploading, setScanUploading] = useState(false);
  const [scanFile, setScanFile] = useState({ fileData:"", fileName:"" });
  const [viewScan, setViewScan] = useState(null);
  const [showNewForm, setShowNewForm] = useState(false);
  const [newForm, setNewForm] = useState({ sheetNo:"", passengerName:"", pickup:"GITAM", destination:"", date: today(), startTime:"", startKms:"", closeTime:"", closeKms:"", totalTime:"", remarks:"", purpose:"Official Travel" });
  const nSet = (k,v) => setNewForm(p => ({...p,[k]:v}));
  const computeNewKms = () => { const s=Number(newForm.startKms),c=Number(newForm.closeKms); return (s&&c&&c>=s)?c-s:null; };

  const submitNewTrip = () => {
    if (!newForm.passengerName.trim()) { alert("Passenger name is required"); return; }
    if (!newForm.destination.trim()) { alert("Destination is required"); return; }
    if (!newForm.startKms) { alert("Starting KMS is required"); return; }
    const totalKms = computeNewKms();
    let status = "Trip Started";
    if (newForm.closeKms && newForm.closeTime) status = "Trip Completed";
    const newTrip = {
      id: "T" + uid(),
      sheetNo: newForm.sheetNo || String(Date.now()).slice(-4),
      vehicleType: vehicle?.type || "",
      vehicleId: vehicle?.id || "",
      driverId: driver.id,
      passengerName: newForm.passengerName,
      pickup: newForm.pickup,
      destination: newForm.destination,
      purpose: newForm.purpose,
      date: newForm.date,
      startTime: newForm.startTime,
      startKms: Number(newForm.startKms),
      closeTime: newForm.closeTime,
      closeKms: newForm.closeKms ? Number(newForm.closeKms) : "",
      totalKms: totalKms ?? "",
      totalTime: newForm.totalTime,
      remarks: newForm.remarks,
      status,
      requestedBy: driver.name,
      createdAt: today(),
    };
    setTrips(p => [...p, newTrip]);
    setSelectedTripId(newTrip.id);
    setShowNewForm(false);
    setNewForm({ sheetNo:"", passengerName:"", pickup:"GITAM", destination:"", date:today(), startTime:"", startKms:"", closeTime:"", closeKms:"", totalTime:"", remarks:"", purpose:"Official Travel" });
    setSaved(true);
  };

  const trip = trips.find(t => t.id === selectedTripId);
  const existingScan = trip ? docs.find(d => d.tripId === trip.id && d.type === "Trip Sheet Scan") : null;

  const openEdit = (t) => {
    setForm({
      sheetNo: t.sheetNo || "",
      vehicleType: t.vehicleType || (vehicle ? vehicle.type : ""),
      vehicleNumber: vehicle ? vehicle.number : "",
      passengerName: t.passengerName || "",
      pickup: t.pickup || "",
      destination: t.destination || "",
      date: t.date || today(),
      startTime: t.startTime || "",
      startKms: t.startKms || "",
      closeTime: t.closeTime || "",
      closeKms: t.closeKms || "",
      totalTime: t.totalTime || "",
      remarks: t.remarks || "",
    });
    setEditing(true);
    setSaved(false);
  };

  const computeKms = () => {
    const s = Number(form.startKms), c = Number(form.closeKms);
    return (s && c && c >= s) ? c - s : null;
  };

  const fSet = (k, v) => setForm(p => ({ ...p, [k]: v }));

  const save = () => {
    const totalKms = computeKms();
    let newStatus = trip.status;
    if (["Approved","Vehicle Assigned","Driver Assigned"].includes(trip.status)) {
      if (form.startKms && form.startTime) newStatus = "Trip Started";
    }
    if (trip.status === "Trip Started" && form.closeKms && form.closeTime) newStatus = "Trip Completed";
    setTrips(p => p.map(t => t.id === selectedTripId
      ? { ...t, ...form, totalKms: totalKms ?? t.totalKms, status: newStatus }
      : t
    ));
    setEditing(false);
    setSaved(true);
  };

  const handleScanUpload = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setScanUploading(true);
    const reader = new FileReader();
    reader.onload = ev => { setScanFile({ fileData: ev.target.result, fileName: file.name }); setScanUploading(false); };
    reader.readAsDataURL(file);
  };

  const saveScan = () => {
    if (!scanFile.fileData || !trip) return;
    const newDoc = {
      id: existingScan ? existingScan.id : "DOC" + uid(),
      vehicleId: vehicle?.id || "",
      tripId: trip.id,
      name: `Trip Sheet #${trip.sheetNo || trip.id}`,
      type: "Trip Sheet Scan",
      uploadDate: today(),
      expiryDate: "",
      status: "Valid",
      fileName: scanFile.fileName,
      fileData: scanFile.fileData,
      uploadedBy: driver.name,
    };
    setDocs(p => existingScan ? p.map(d => d.id===existingScan.id ? newDoc : d) : [...p, newDoc]);
    setScanFile({ fileData:"", fileName:"" });
    alert("Scan uploaded successfully! Admin can now view it.");

  // GITAM form style
  const TS = {

    formWrap: { background:"#fff", border:"2px solid #1A2C42", borderRadius:8, margin:20, overflow:"hidden" },
    header: { display:"flex", alignItems:"center", padding:"10px 16px", borderBottom:"2px solid #1A2C42", background:"#fff", gap:16 },
    logoBox: { display:"flex", alignItems:"center", gap:10 },

    sheetNo: { background:"#fff", border:"1px solid #1A2C42", padding:"6px 14px", fontSize:13, borderRadius:4 },

    rowLabel: { padding:"9px 12px", fontSize:12, fontWeight:700, color:"#1A2C42", background:"#F8FAFC", borderRight:"1px solid #CBD5E1" },
    rowVal: { padding:"9px 12px", fontSize:13, color:"#0F1C2E", fontWeight:600 },
    rowInp: { padding:"7px 10px", border:"none", outline:"none", fontSize:13, width:"100%", background:"transparent", fontWeight:600 },
    tableHead: { display:"grid", gridTemplateColumns:"90px 90px 90px 90px 90px 90px 90px 1fr", background:"#0F1C2E" },
    tableRow: { display:"grid", gridTemplateColumns:"90px 90px 90px 90px 90px 90px 90px 1fr", borderBottom:"1px solid #CBD5E1" },
    th: { padding:"8px 6px", fontSize:10, fontWeight:700, color:"#fff", textAlign:"center", borderRight:"1px solid #1F3048" },

    tdInp: { padding:"6px 4px", border:"none", outline:"none", fontSize:12, width:"100%", textAlign:"center", background:"transparent", fontWeight:600 },
    sigRow: { display:"grid", gridTemplateColumns:"1fr 1fr", borderTop:"2px solid #1A2C42" },
    sigCell: { padding:"12px 16px" },
  };

  return (

        </button>
      </div>

      {/* New Trip Sheet Form */}
      {showNewForm && (
        <div style={{ background:"#fff", borderRadius:12, boxShadow:"0 1px 8px rgba(0,0,0,.08)", padding:"20px 24px", marginBottom:20 }}>
          <div style={{ fontSize:15, fontWeight:700, color:"#0F1C2E", marginBottom:16, borderBottom:"1px solid #E2E8F0", paddingBottom:10 }}>
            Create New Trip Sheet
          </div>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:14, marginBottom:14 }}>
            <FormField label="Sheet No. (optional)"><Inp value={newForm.sheetNo} onChange={e=>nSet("sheetNo",e.target.value)} placeholder="e.g. 632"/></FormField>
            <FormField label="Passenger Name *"><Inp value={newForm.passengerName} onChange={e=>nSet("passengerName",e.target.value)} placeholder="Passenger(s)"/></FormField>
            <FormField label="Purpose"><Inp value={newForm.purpose} onChange={e=>nSet("purpose",e.target.value)}/></FormField>
            <FormField label="Pickup / From"><Inp value={newForm.pickup} onChange={e=>nSet("pickup",e.target.value)}/></FormField>
            <FormField label="Destination *"><Inp value={newForm.destination} onChange={e=>nSet("destination",e.target.value)} placeholder="e.g. Bengaluru"/></FormField>
            <FormField label="Date"><Inp type="date" value={newForm.date} onChange={e=>nSet("date",e.target.value)}/></FormField>
            <FormField label="Start Time"><Inp type="time" value={newForm.startTime} onChange={e=>nSet("startTime",e.target.value)}/></FormField>
            <FormField label="Starting KMS *"><Inp type="number" value={newForm.startKms} onChange={e=>nSet("startKms",e.target.value)} placeholder="e.g. 75763"/></FormField>
            <div/>
            <FormField label="Close Time"><Inp type="time" value={newForm.closeTime} onChange={e=>nSet("closeTime",e.target.value)}/></FormField>
            <FormField label="Closing KMS"><Inp type="number" value={newForm.closeKms} onChange={e=>nSet("closeKms",e.target.value)} placeholder="e.g. 75880"/></FormField>
            <FormField label="Total KMS">
              <div style={{ padding:"9px 12px", background:"#F0FDF4", border:"1px solid #D1FAE5", borderRadius:7, fontSize:13, fontWeight:700, color:"#15803D" }}>

                  {editing && <button style={C.btn("success")} onClick={save}><Icon n="check" size={14} color="#fff"/>Save</button>}

              {/* Physical-form style layout */}

                {/* GITAM Header */}

                  </div>

                  </div>
                  {/* Close Time */}
