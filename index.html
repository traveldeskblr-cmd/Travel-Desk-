const daysUntil = (d) => { if (!d) return 9999; const diff = new Date(d) - new Date(); return Math.ceil(diff / 86400000); };

// ─── Firebase RTDB hook (falls back to localStorage when FB not configured) ───
const useRTDB = (key, init) => {
  const [v, sv] = useState(() => {
    try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : init; } catch { return init; }
  });
  const skipWrite = useRef(false); // prevent echo-write on remote update

  useEffect(() => {
    if (!FB_READY) return;
    const db = firebase.database();
    const ref = db.ref("travel_desk/" + key);

    // Listen for remote changes
    const unsub = ref.on("value", (snap) => {
      const data = snap.val();
      if (data !== null) {
        skipWrite.current = true;
        sv(data);
      } else {
        // First run: seed Firebase with initial data
        ref.set(init);
      }
    });

    return () => ref.off("value", unsub);
  }, [key]);

  // Write to Firebase (and localStorage as backup) when state changes
  useEffect(() => {
    localStorage.setItem(key, JSON.stringify(v));
    if (!FB_READY) return;
    if (skipWrite.current) { skipWrite.current = false; return; }
    firebase.database().ref("travel_desk/" + key).set(v);
  }, [key, v]);

  return [v, sv];
};

  <div style={C.statCard(accent)}>

    {sub && <div style={{ fontSize:11, color:accent, marginTop:4, fontWeight:600 }}>{sub}</div>}
  </div>
);

const Modal = ({ title, onClose, children, wide }) => (
  <div style={C.modal} onClick={e => e.target === e.currentTarget && onClose()}>
    <div style={{ ...C.modalBox, maxWidth: wide ? 800 : 600 }}>
      <div style={C.modalHead}>
        <span style={C.modalTitle}>{title}</span>
        <button style={C.iconBtn} onClick={onClose}><Icon n="close" size={20} color="#64748B"/></button>
      </div>
      {children}
    </div>
  </div>
);

    <Icon n={type==="danger"?"close":type==="info"?"bell":"warn"} size={16} color={type==="danger"?"#EF4444":type==="info"?"#2E7CF6":"#F59E0B"}/>

);

const SearchBox = ({ value, onChange, placeholder }) => (

// ─── OTP Helpers ──────────────────────────────────────────────────────────────
const OTP_EXPIRY_MS = 5 * 60 * 1000; // 5 minutes
const INACTIVITY_MS = 15 * 60 * 1000; // 15 minutes auto-logout
const generateOTP = () => String(Math.floor(100000 + Math.random() * 900000));

// ─── Login Screen ──────────────────────────────────────────────────────────────
function Login({ onLogin, drivers, setDrivers }) {
  const [mode, setMode] = useState("admin");
  const [pass, setPass] = useState("");
  // Driver OTP flow states
  const [step, setStep] = useState("empid"); // "empid" | "otp"
  const [empId, setEmpId] = useState("");
  const [otp, setOtp] = useState("");
  const [otpStore, setOtpStore] = useState(null); // { code, expires, maskedMobile, driverId }
  const [otpInput, setOtpInput] = useState("");
  const [resendCooldown, setResendCooldown] = useState(0);
  const [err, setErr] = useState("");
  const [info, setInfo] = useState("");

  // Countdown timer for resend
  useEffect(() => {
    if (resendCooldown <= 0) return;
    const t = setTimeout(() => setResendCooldown(c => c - 1), 1000);
    return () => clearTimeout(t);
  }, [resendCooldown]);

  const maskMobile = (m) => m ? m.slice(0,2) + "XXXXXX" + m.slice(-2) : "XXXXXXXX";

  const handleVerifyEmpId = () => {
    setErr("");
    const d = drivers.find(x => x.empId === empId.trim());
    if (!d) { setErr("Employee ID not registered in the system."); return; }
    if (!d.active) { setErr("Your access has been deactivated. Please contact Admin."); return; }
    sendOTP(d);
  };

  const sendOTP = (d) => {
    const code = generateOTP();
    const expires = Date.now() + OTP_EXPIRY_MS;
    setOtpStore({ code, expires, maskedMobile: maskMobile(d.mobile), driverId: d.id });
    setOtpInput("");
    setErr("");
    setStep("otp");
    setResendCooldown(30);
    // In production this would call an SMS API. For demo, show OTP in info.
    setInfo(`[Demo] OTP sent to ${maskMobile(d.mobile)}: ${code}`);
  };

  const handleVerifyOTP = () => {
    setErr("");
    if (!otpStore) return;
    if (Date.now() > otpStore.expires) {
      setErr("OTP has expired. Please request a new one.");
      setOtpStore(null);
      setStep("empid");
      return;
    }
    if (otpInput.trim() !== otpStore.code) {
      setErr("Invalid OTP. Please try again.");
      return;
    }
    // Success — log the login and proceed
    const d = drivers.find(x => x.id === otpStore.driverId);
    const loginEntry = { ts: new Date().toLocaleString(), empId: d.empId };
    setDrivers(prev => prev.map(x => x.id === d.id
      ? { ...x, loginLog: [...(x.loginLog||[]).slice(-19), loginEntry] }
      : x
    ));
    onLogin({ role:"driver", name:d.name, driverId:d.id, empId:d.empId, loginTime: Date.now() });
  };

  const handleResend = () => {
    if (resendCooldown > 0) return;
    const d = drivers.find(x => x.empId === empId.trim());
    if (d) sendOTP(d);
  };

  const resetDriverFlow = () => { setStep("empid"); setEmpId(""); setOtpInput(""); setOtpStore(null); setErr(""); setInfo(""); };

  const adminSubmit = () => {
    setErr("");
    if (pass === "admin123") onLogin({ role:"admin", name:"Administrator" });
    else setErr("Invalid password.");
  };

  const logoBox = (
    <div style={{ textAlign:"center", marginBottom:28 }}>
      <div style={{ width:52, height:52, background:"#2E7CF6", borderRadius:14, margin:"0 auto 12px", display:"flex", alignItems:"center", justifyContent:"center" }}>
        <Icon n="vehicle" size={28} color="#fff"/>
      </div>
      <h1 style={{ fontSize:22, fontWeight:800, color:"#0F1C2E", margin:0 }}>Travel Desk</h1>
      <p style={{ color:"#64748B", fontSize:13, margin:"4px 0 0" }}>Fleet & Trip Management</p>
    </div>
  );

  return (
    <div style={C.loginWrap}>
      <div style={C.loginCard}>
        {logoBox}
        {/* Tab switcher */}
        <div style={{ display:"flex", gap:6, marginBottom:20, background:"#F1F5F9", borderRadius:8, padding:4 }}>
          {["admin","driver"].map(m => (
            <button key={m} onClick={() => { setMode(m); setErr(""); setInfo(""); resetDriverFlow(); }} style={{ flex:1, padding:"8px 0", borderRadius:6, border:"none", fontWeight:600, fontSize:13, cursor:"pointer", background:mode===m?"#fff":"transparent", color:mode===m?"#0F1C2E":"#64748B", boxShadow:mode===m?"0 1px 3px rgba(0,0,0,.12)":"none" }}>
              {m === "admin" ? "Admin" : "Driver"}
            </button>
          ))}
        </div>

        {mode === "admin" ? (
          <>
            <FormField label="Password">
              <Inp type="password" placeholder="Enter admin password" value={pass} onChange={e=>setPass(e.target.value)} onKeyDown={e=>e.key==="Enter"&&adminSubmit()}/>
            </FormField>
            {err && <p style={{ color:"#EF4444", fontSize:12, marginTop:8 }}>{err}</p>}
            <button style={{ ...C.btn("primary"), width:"100%", justifyContent:"center", marginTop:18, padding:"11px 0", fontSize:14 }} onClick={adminSubmit}>Sign In</button>
            <p style={{ fontSize:11, color:"#94A3B8", textAlign:"center", marginTop:14 }}>Admin password: admin123</p>
          </>
        ) : step === "empid" ? (
          <>
            <div style={{ fontSize:13, color:"#475569", marginBottom:14, lineHeight:1.5 }}>Enter your Employee ID to receive a One-Time Password on your registered mobile number.</div>
            <FormField label="Employee ID">
              <Inp placeholder="e.g. EMP101" value={empId} onChange={e=>setEmpId(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleVerifyEmpId()}/>
            </FormField>
            {err && <p style={{ color:"#EF4444", fontSize:12, marginTop:8 }}>{err}</p>}
            <button style={{ ...C.btn("primary"), width:"100%", justifyContent:"center", marginTop:18, padding:"11px 0", fontSize:14 }} onClick={handleVerifyEmpId}>Send OTP</button>
            <p style={{ fontSize:11, color:"#94A3B8", textAlign:"center", marginTop:14 }}>Demo drivers: EMP101, EMP102, EMP104</p>
          </>
        ) : (
          <>
            <div style={{ background:"#EFF6FF", border:"1px solid #BFDBFE", borderRadius:8, padding:"10px 14px", marginBottom:16 }}>
              <div style={{ fontSize:13, color:"#1D4ED8", fontWeight:600 }}>OTP Sent</div>
              <div style={{ fontSize:12, color:"#374151", marginTop:2 }}>A 6-digit OTP has been sent to {otpStore?.maskedMobile}. It is valid for 5 minutes.</div>
            </div>
            {info && <div style={{ background:"#FEF9C3", border:"1px solid #FDE047", borderRadius:7, padding:"8px 12px", fontSize:12, color:"#713F12", marginBottom:12 }}>{info}</div>}
            <FormField label="Enter OTP">
              <Inp
                placeholder="6-digit OTP"
                value={otpInput}
                onChange={e=>setOtpInput(e.target.value.replace(/\D/g,"").slice(0,6))}
                onKeyDown={e=>e.key==="Enter"&&handleVerifyOTP()}
                style={{ ...C.input, letterSpacing:6, fontSize:20, textAlign:"center", fontWeight:700 }}
                maxLength={6}
              />
            </FormField>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginTop:8 }}>
              <button
                style={{ background:"none", border:"none", fontSize:12, cursor:resendCooldown>0?"default":"pointer", color:resendCooldown>0?"#94A3B8":"#2E7CF6", fontWeight:600 }}
                onClick={handleResend}
                disabled={resendCooldown>0}
              >
                {resendCooldown > 0 ? `Resend OTP in ${resendCooldown}s` : "Resend OTP"}
              </button>
              <button style={{ background:"none", border:"none", fontSize:12, cursor:"pointer", color:"#64748B" }} onClick={resetDriverFlow}>← Change ID</button>
            </div>
            {err && <p style={{ color:"#EF4444", fontSize:12, marginTop:8 }}>{err}</p>}
            <button style={{ ...C.btn("primary"), width:"100%", justifyContent:"center", marginTop:18, padding:"11px 0", fontSize:14 }} onClick={handleVerifyOTP}>Verify & Sign In</button>
          </>
        )}
      </div>
    </div>
  );
}

// ─── Dashboard ─────────────────────────────────────────────────────────────────
function Dashboard({ vehicles, drivers, trips, docs }) {
  const alerts = useMemo(() => {
    const out = [];
    vehicles.forEach(v => {
      [["insuranceExpiry","Insurance"],["pucExpiry","PUC"],["fitnessExpiry","Fitness"],["roadTaxExpiry","Road Tax"],["permitExpiry","Permit"]].forEach(([k,label]) => {
        const days = daysUntil(v[k]);
        if (days < 0) out.push({ type:"danger", msg:`${v.number}: ${label} expired ${Math.abs(days)} days ago` });
        else if (days <= 30) out.push({ type:"warn", msg:`${v.number}: ${label} expires in ${days} days` });
      });
    });
    drivers.forEach(d => {
      const days = daysUntil(d.licenseExpiry);
      if (days < 0) out.push({ type:"danger", msg:`${d.name}: License expired ${Math.abs(days)} days ago` });
      else if (days <= 60) out.push({ type:"warn", msg:`${d.name}: License expires in ${days} days` });
    });
    return out.slice(0,8);
  }, [vehicles, drivers]);

  const upcoming = trips.filter(t => t.status === "Approved" || t.status === "Vehicle Assigned" || t.status === "Driver Assigned");
  const active = trips.filter(t => t.status === "Trip Started");

  // Mini bar chart
  const statusCounts = VEHICLE_STATUSES.map(s => ({ label:s, count:vehicles.filter(v=>v.status===s).length }));
  const maxCount = Math.max(...statusCounts.map(x=>x.count), 1);

  return (
    <div>
      <div style={C.statsGrid}>
        <Stat label="Total Vehicles" value={vehicles.length} accent="#2E7CF6"/>
        <Stat label="Available" value={vehicles.filter(v=>v.status==="Available").length} accent="#10B981"/>
        <Stat label="On Trip" value={vehicles.filter(v=>v.status==="On Trip").length} accent="#2E7CF6"/>
        <Stat label="Under Maintenance" value={vehicles.filter(v=>v.status==="Under Maintenance").length} accent="#F59E0B"/>
        <Stat label="Total Drivers" value={drivers.length} accent="#8B5CF6"/>
        <Stat label="Available Drivers" value={drivers.filter(d=>d.status==="Available").length} accent="#10B981"/>
        <Stat label="Active Trips" value={active.length} accent="#EF4444"/>
        <Stat label="Upcoming Trips" value={upcoming.length} accent="#EC4899"/>
      </div>

      <div style={C.sectionGrid}>
        {/* Alerts */}
        <div style={{ ...C.tableWrap }}>
          <div style={C.tableHeader}><span style={C.tableTitle}>🔔 Expiry Alerts</span></div>
          <div style={{ padding:"12px 16px", maxHeight:260, overflowY:"auto" }}>
            {alerts.length === 0 && <p style={C.emptyState}>No alerts — all documents current!</p>}
            {alerts.map((a,i) => <Alert key={i} type={a.type}>{a.msg}</Alert>)}
          </div>
        </div>
        {/* Vehicle Fleet Status */}
        <div style={C.tableWrap}>
          <div style={C.tableHeader}><span style={C.tableTitle}>Fleet Status</span></div>
          <div style={{ padding:"16px 20px" }}>
            {statusCounts.map(({ label, count }) => (
              <div key={label} style={{ marginBottom:12 }}>
                <div style={{ display:"flex", justifyContent:"space-between", fontSize:12, marginBottom:4 }}>
                  <span style={{ color:"#374151", fontWeight:500 }}>{label}</span>
                  <span style={{ color:"#64748B" }}>{count} vehicle{count!==1?"s":""}</span>
                </div>
                <div style={{ background:"#F1F5F9", borderRadius:4, height:8, overflow:"hidden" }}>
                  <div style={{ width:`${(count/maxCount)*100}%`, height:"100%", background:statusColor(label), borderRadius:4, transition:"width .4s" }}/>
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* Recent Trips */}
      <div style={C.tableWrap}>
        <div style={C.tableHeader}><span style={C.tableTitle}>Recent Trips</span></div>
        <table style={C.table}>
          <thead><tr>
            {["Trip ID","Date","Route","Purpose","Status"].map(h=><th key={h} style={C.th}>{h}</th>)}
          </tr></thead>
          <tbody>
            {trips.slice(0,6).map(t => (
              <tr key={t.id}>
                <td style={C.td}><span style={{ fontFamily:"monospace", color:"#2E7CF6" }}>{t.id}</span></td>
                <td style={C.td}>{fmtDate(t.date)} {t.time}</td>
                <td style={C.td}><span style={{ fontSize:12 }}>{t.pickup} → {t.destination}</span></td>
                <td style={C.td}>{t.purpose}</td>
                <td style={C.td}><Badge status={t.status}/></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

        <FormField label="PUC Expiry"><Inp type="date" value={f.pucExpiry} onChange={e=>set("pucExpiry",e.target.value)}/></FormField>
        <FormField label="Fitness Certificate Expiry"><Inp type="date" value={f.fitnessExpiry} onChange={e=>set("fitnessExpiry",e.target.value)}/></FormField>
        <FormField label="Road Tax Expiry"><Inp type="date" value={f.roadTaxExpiry} onChange={e=>set("roadTaxExpiry",e.target.value)}/></FormField>
        <FormField label="Permit Expiry"><Inp type="date" value={f.permitExpiry} onChange={e=>set("permitExpiry",e.target.value)}/></FormField>
      </div>
      <div style={{ gridColumn:"1/-1", marginTop:8 }}>
        <FormField label="Notes / Additional Info"><textarea style={{ ...C.input, minHeight:60, resize:"vertical", width:"100%", boxSizing:"border-box" }} value={f.notes} onChange={e=>set("notes",e.target.value)}/></FormField>
      </div>
      <div style={{ display:"flex", gap:10, justifyContent:"flex-end", marginTop:20 }}>

      </div>
    </div>
  );
}

function Vehicles({ vehicles, setVehicles, drivers }) {
  const [modal, setModal] = useState(null);
  const [search, setSearch] = useState("");
  const [filterType, setFilterType] = useState("");
  const [filterStatus, setFilterStatus] = useState("");

  const filtered = vehicles.filter(v => {
    const q = search.toLowerCase();
    return (!q || v.number.toLowerCase().includes(q) || v.make.toLowerCase().includes(q) || v.model.toLowerCase().includes(q))
      && (!filterType || v.type === filterType)
      && (!filterStatus || v.status === filterStatus);
  });

  const save = (v) => {
    setVehicles(p => p.find(x=>x.id===v.id) ? p.map(x=>x.id===v.id?v:x) : [...p,v]);
    setModal(null);
  };

  const del = (id) => { if (window.confirm("Delete vehicle?")) setVehicles(p=>p.filter(x=>x.id!==id)); };

  const getDriver = (dId) => drivers.find(d => d.id === dId);

  const expiryWarn = (v) => {
    const fields = ["insuranceExpiry","pucExpiry","fitnessExpiry","roadTaxExpiry","permitExpiry"];
    return fields.some(k => { const days = daysUntil(v[k]); return days >= 0 && days <= 30; });
  };

  return (
    <div>
      <div style={C.tableWrap}>
        <div style={C.tableHeader}>
          <span style={C.tableTitle}>Vehicle Fleet ({filtered.length})</span>
          <button style={C.btn("primary")} onClick={() => setModal({ mode:"add" })}><Icon n="plus" size={16} color="#fff"/> Add Vehicle</button>
        </div>
        <div style={C.filterRow}>
          <SearchBox value={search} onChange={setSearch} placeholder="Search by number, make, model…"/>
          <select style={{ ...C.select, minWidth:130, width:"auto" }} value={filterType} onChange={e=>setFilterType(e.target.value)}>
            <option value="">All Types</option>
            {VEHICLE_TYPES.map(t=><option key={t}>{t}</option>)}
          </select>
          <select style={{ ...C.select, minWidth:150, width:"auto" }} value={filterStatus} onChange={e=>setFilterStatus(e.target.value)}>
            <option value="">All Statuses</option>
            {VEHICLE_STATUSES.map(s=><option key={s}>{s}</option>)}
          </select>
        </div>
        <div style={{ overflowX:"auto" }}>
          <table style={C.table}>
            <thead><tr>
              {["Number","Type","Make / Model","Capacity","Fuel","Driver","Status","Insurance","PUC","Actions"].map(h=><th key={h} style={C.th}>{h}</th>)}
            </tr></thead>
            <tbody>
              {filtered.length === 0 && <tr><td colSpan={10} style={{ ...C.td, ...C.emptyState }}>No vehicles found</td></tr>}
              {filtered.map(v => {
                const drv = getDriver(v.driverId);
                return (
                  <tr key={v.id} style={{ background: expiryWarn(v) ? "#FFFBEB" : "" }}>
                    <td style={C.td}><strong style={{ color:"#0F1C2E" }}>{v.number}</strong></td>
                    <td style={C.td}>{v.type}</td>
                    <td style={C.td}>{v.make} {v.model}</td>
                    <td style={C.td}>{v.capacity}</td>
                    <td style={C.td}>{v.fuel}</td>
                    <td style={C.td}>{drv ? <span style={{ fontSize:12 }}>{drv.name}</span> : <span style={{ color:"#94A3B8" }}>Unassigned</span>}</td>
                    <td style={C.td}><Badge status={v.status}/></td>
                    <td style={C.td}><span style={C.chip(statusColor(expiryStatus(v.insuranceExpiry)))}>{fmtDate(v.insuranceExpiry)}</span></td>
                    <td style={C.td}><span style={C.chip(statusColor(expiryStatus(v.pucExpiry)))}>{fmtDate(v.pucExpiry)}</span></td>
                    <td style={C.td}>
                      <div style={C.row}>
                        <button style={{ ...C.iconBtn, color:"#2E7CF6" }} title="Edit" onClick={() => setModal({ mode:"edit", vehicle:v })}><Icon n="edit" size={16} color="#2E7CF6"/></button>
                        <button style={{ ...C.iconBtn }} title="Delete" onClick={() => del(v.id)}><Icon n="trash" size={16} color="#EF4444"/></button>
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>

      {modal && (
        <Modal title={modal.mode==="add"?"Add New Vehicle":"Edit Vehicle"} onClose={() => setModal(null)} wide>
          <VehicleForm vehicle={modal.vehicle} drivers={drivers} onSave={save} onClose={() => setModal(null)}/>
        </Modal>
      )}
    </div>
  );
}

// ─── Documents ─────────────────────────────────────────────────────────────────
const ALL_DOC_TYPES_ORDERED = ["Registration Certificate","Insurance","PUC","Fitness","Road Tax","Vehicle Permit","Driver License","Other","Trip Sheet Scan"];

function DocViewerModal({ doc, onClose }) {
  if (!doc || !doc.fileData) return null;
  const isImage = doc.fileData.startsWith("data:image");
  const isPdf = doc.fileData.startsWith("data:application/pdf");
  return (
    <div style={C.modal} onClick={e => e.target === e.currentTarget && onClose()}>
      <div style={{ background:"#fff", borderRadius:12, width:"100%", maxWidth:820, maxHeight:"92vh", display:"flex", flexDirection:"column", boxShadow:"0 20px 60px rgba(0,0,0,.35)", overflow:"hidden" }}>
        <div style={{ ...C.modalHead, flexShrink:0 }}>
          <div>
            <div style={C.modalTitle}>{doc.name}</div>
            <div style={{ fontSize:12, color:"#64748B", marginTop:2 }}>{doc.type} — {doc.fileName}</div>
          </div>
          <div style={{ display:"flex", gap:8 }}>
            <a href={doc.fileData} download={doc.fileName} style={{ ...C.btn("success"), textDecoration:"none" }}><Icon n="download" size={15} color="#fff"/> Download</a>
            <button style={C.iconBtn} onClick={onClose}><Icon n="close" size={20} color="#64748B"/></button>
          </div>
        </div>
        <div style={{ flex:1, overflow:"auto", background:"#F0F4F9", display:"flex", alignItems:"center", justifyContent:"center", padding:16 }}>
          {isImage && <img src={doc.fileData} alt={doc.name} style={{ maxWidth:"100%", maxHeight:"75vh", borderRadius:6, boxShadow:"0 4px 16px rgba(0,0,0,.15)" }}/>}
          {isPdf && <iframe src={doc.fileData} title={doc.name} style={{ width:"100%", height:"75vh", border:"none", borderRadius:6 }}/>}
          {!isImage && !isPdf && <div style={{ color:"#64748B", fontSize:14 }}>Preview not available. Use Download to open.</div>}
        </div>
      </div>
    </div>
  );
}

const VEHICLE_VIEW_DOC_TYPES = ALL_DOC_TYPES_ORDERED.filter(t => t !== "Trip Sheet Scan");

function VehicleDocCard({ vehicle, docs, onUpload, onView, onDelete }) {
  const vDocs = docs.filter(d => d.vehicleId === vehicle.id);
  const getDoc = (type) => vDocs.find(d => d.type === type);

  return (
    <div style={{ background:"#fff", borderRadius:10, boxShadow:"0 1px 4px rgba(0,0,0,.08)", overflow:"hidden", marginBottom:16 }}>
      {/* Card header */}
      <div style={{ background:"#0F1C2E", padding:"12px 16px", display:"flex", alignItems:"center", justifyContent:"space-between" }}>
        <div style={{ display:"flex", alignItems:"center", gap:10 }}>
          <Icon n="vehicle" size={18} color="#2E7CF6"/>
          <div>
            <div style={{ color:"#fff", fontWeight:700, fontSize:14 }}>{vehicle.number}</div>
            <div style={{ color:"#94A3B8", fontSize:11 }}>{vehicle.make} {vehicle.model} · {vehicle.type}</div>
          </div>
        </div>
        <div style={{ display:"flex", alignItems:"center", gap:8 }}>
          <span style={C.badge(statusColor(vehicle.status))}>{vehicle.status}</span>
          <button style={{ ...C.btn("primary"), padding:"5px 12px", fontSize:12 }} onClick={() => onUpload(vehicle.id)}>
            <Icon n="plus" size={13} color="#fff"/> Add Doc
          </button>
        </div>
      </div>
      {/* Document grid */}
      <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(160px,1fr))", gap:1, background:"#E2E8F0" }}>
        {VEHICLE_VIEW_DOC_TYPES.map(type => {
          const doc = getDoc(type);
          const s = doc ? (doc.expiryDate ? expiryStatus(doc.expiryDate) : "Valid") : null;
          const col = s ? statusColor(s) : "#D1D5DB";
          return (
            <div key={type} style={{ background:"#fff", padding:"12px 14px", display:"flex", flexDirection:"column", gap:6, minHeight:90 }}>
              <div style={{ fontSize:11, fontWeight:700, color:"#64748B", textTransform:"uppercase", letterSpacing:"0.4px" }}>{type}</div>
              {doc ? (
                <>
                  <div style={{ fontSize:12, fontWeight:600, color:"#0F1C2E", flex:1, lineHeight:1.3 }}>{doc.name}</div>
                  {doc.expiryDate && <div style={C.chip(col)}>{fmtDate(doc.expiryDate)}</div>}
                  {!doc.expiryDate && <div style={{ fontSize:11, color:"#94A3B8" }}>No expiry</div>}
                  <div style={{ display:"flex", gap:4, marginTop:2 }}>
                    {doc.fileData && <button style={{ ...C.iconBtn, background:"#EFF6FF", borderRadius:4, padding:"3px 7px" }} title="View scan" onClick={() => onView(doc)}><Icon n="eye" size={13} color="#2E7CF6"/></button>}
                    {!doc.fileData && <span style={{ fontSize:10, color:"#F59E0B", fontStyle:"italic" }}>No scan</span>}
                    <button style={{ ...C.iconBtn, background:"#FFF7ED", borderRadius:4, padding:"3px 7px" }} title="Delete" onClick={() => onDelete(doc.id)}><Icon n="trash" size={13} color="#EF4444"/></button>
                  </div>
                </>
              ) : (
                <div style={{ flex:1, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:4 }}>
                  <div style={{ width:28, height:28, borderRadius:99, background:"#F1F5F9", display:"flex", alignItems:"center", justifyContent:"center" }}>
                    <Icon n="plus" size={14} color="#94A3B8"/>
                  </div>
                  <div style={{ fontSize:10, color:"#94A3B8" }}>Not uploaded</div>
                  <button style={{ fontSize:10, color:"#2E7CF6", background:"none", border:"none", cursor:"pointer", padding:0 }} onClick={() => onUpload(vehicle.id, type)}>Upload</button>
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function Documents({ docs, setDocs, vehicles }) {
  const [modal, setModal] = useState(null); // "add"|"edit"|"view"
  const [viewDoc, setViewDoc] = useState(null);
  const [filterVehicle, setFilterVehicle] = useState("");
  const [viewMode, setViewMode] = useState("vehicle"); // "vehicle"|"table"
  const [search, setSearch] = useState("");
  const [filterType, setFilterType] = useState("");
  const [filterFrom, setFilterFrom] = useState("");
  const [filterTo, setFilterTo] = useState("");
  const [uploading, setUploading] = useState(false);

  const blank = () => ({ id:"DOC"+uid(), vehicleId:"", name:"", type:"Insurance", uploadDate:today(), expiryDate:"", status:"Valid", fileName:"", fileData:"" });
  const [f, setF] = useState(blank());
  const fSet = (k,v) => setF(p=>({...p,[k]:v}));

  const openAdd = (vehicleId="", type="") => {
    setF({ ...blank(), vehicleId, type: type || "Insurance" });
    setModal("add");
  };

  const handleFileChange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setUploading(true);
    const reader = new FileReader();
    reader.onload = (ev) => {
      fSet("fileData", ev.target.result);
      fSet("fileName", file.name);
      setUploading(false);
    };
    reader.readAsDataURL(file);
  };

  const save = () => {
    if (!f.vehicleId || !f.name) return alert("Vehicle and document name required");
    const withStatus = { ...f, status: f.expiryDate ? expiryStatus(f.expiryDate) : "Valid" };
    setDocs(p => p.find(x=>x.id===f.id) ? p.map(x=>x.id===f.id?withStatus:x) : [...p,withStatus]);
    setModal(null);
  };

  const del = (id) => { if (window.confirm("Delete document?")) setDocs(p=>p.filter(x=>x.id!==id)); };

  const filtered = docs.filter(d => {
    const q = search.toLowerCase();
    return (!q || d.name.toLowerCase().includes(q))
      && (!filterVehicle || d.vehicleId === filterVehicle)
      && (!filterType || d.type === filterType)
      && (!filterFrom || (d.uploadDate && d.uploadDate >= filterFrom))
      && (!filterTo || (d.uploadDate && d.uploadDate <= filterTo));
  });

  const getVehicle = (vid) => vehicles.find(v=>v.id===vid);
  const displayedVehicles = filterVehicle ? vehicles.filter(v=>v.id===filterVehicle) : vehicles;

  return (
    <div>
      <div style={{ ...C.tableWrap, marginBottom:16 }}>
        <div style={C.tableHeader}>
          <span style={C.tableTitle}>Vehicle Documents</span>
          <div style={C.row}>
            {/* View toggle */}
            <div style={{ display:"flex", border:"1px solid #E2E8F0", borderRadius:7, overflow:"hidden" }}>
              {[["vehicle","Vehicle View"],["table","Table View"]].map(([v,label]) => (
                <button key={v} style={{ padding:"6px 14px", fontSize:12, fontWeight:600, border:"none", cursor:"pointer", background:viewMode===v?"#2E7CF6":"#fff", color:viewMode===v?"#fff":"#64748B" }} onClick={() => setViewMode(v)}>{label}</button>
              ))}
            </div>
            <button style={C.btn("primary")} onClick={() => openAdd()}><Icon n="plus" size={16} color="#fff"/> Upload Document</button>
          </div>
        </div>
        <div style={C.filterRow}>
          <SearchBox value={search} onChange={setSearch} placeholder="Search document name…"/>
          <select style={{ ...C.select, minWidth:160, width:"auto" }} value={filterVehicle} onChange={e=>setFilterVehicle(e.target.value)}>
            <option value="">All Vehicles</option>
            {vehicles.map(v=><option key={v.id} value={v.id}>{v.number}</option>)}
          </select>
          {viewMode === "table" && (
            <select style={{ ...C.select, minWidth:160, width:"auto" }} value={filterType} onChange={e=>setFilterType(e.target.value)}>
              <option value="">All Types</option>
              {ALL_DOC_TYPES_ORDERED.map(t=><option key={t}>{t}</option>)}
            </select>
          )}
          {viewMode === "table" && (
            <div style={{ display:"flex", gap:8, alignItems:"center", marginLeft:"auto" }}>
              <span style={{ fontSize:12, color:"#64748B" }}>From:</span>
              <input type="date" style={{ ...C.input, padding:"6px 10px" }} value={filterFrom} onChange={e=>setFilterFrom(e.target.value)}/>
              <span style={{ fontSize:12, color:"#64748B" }}>To:</span>
              <input type="date" style={{ ...C.input, padding:"6px 10px" }} value={filterTo} onChange={e=>setFilterTo(e.target.value)}/>
              {(filterFrom || filterTo) && (
                <button style={{ ...C.btn("ghost"), padding:"6px 10px", fontSize:12 }} onClick={()=>{setFilterFrom("");setFilterTo("");}}>Clear</button>
              )}
            </div>
          )}
        </div>
      </div>

      {/* ── Vehicle Card View ─────────────────────────────────────────── */}
      {viewMode === "vehicle" && (
        <div>
          {displayedVehicles.length === 0 && <div style={{ ...C.emptyState, background:"#fff", borderRadius:10, padding:48 }}>No vehicles found</div>}
          {displayedVehicles.map(v => (
            <VehicleDocCard
              key={v.id}
              vehicle={v}
              docs={docs}
              onUpload={(vid, type) => openAdd(vid, type)}
              onView={(doc) => { setViewDoc(doc); setModal("view"); }}
              onDelete={del}
            />
          ))}
        </div>
      )}

      {/* ── Table View ───────────────────────────────────────────────── */}
      {viewMode === "table" && (
        <div style={C.tableWrap}>
          <div style={{ overflowX:"auto" }}>
            <table style={C.table}>
              <thead><tr>
                {["Vehicle","Document Name","Type","Upload Date","Expiry","Status","Scan","Actions"].map(h=><th key={h} style={C.th}>{h}</th>)}
              </tr></thead>
              <tbody>
                {filtered.length===0 && <tr><td colSpan={8} style={{ ...C.td, textAlign:"center", color:"#94A3B8" }}>No documents found</td></tr>}
                {filtered.map(d => {
                  const v = getVehicle(d.vehicleId);
                  const s = d.expiryDate ? expiryStatus(d.expiryDate) : "Valid";
                  return (
                    <tr key={d.id}>
                      <td style={C.td}>{v ? <span style={{ fontWeight:600, color:"#2E7CF6" }}>{v.number}</span> : "—"}</td>
                      <td style={C.td}><div style={{ display:"flex", alignItems:"center", gap:8 }}><Icon n="doc" size={15} color="#64748B"/>{d.name}</div></td>
                      <td style={C.td}><span style={C.chip("#64748B")}>{d.type}</span></td>
                      <td style={C.td}>{fmtDate(d.uploadDate)}</td>
                      <td style={C.td}>{d.expiryDate ? <span style={C.chip(statusColor(s))}>{fmtDate(d.expiryDate)}</span> : <span style={{ color:"#94A3B8" }}>N/A</span>}</td>
                      <td style={C.td}><Badge status={s}/></td>
                      <td style={C.td}>
                        {d.fileData
                          ? <button style={{ ...C.iconBtn, background:"#EFF6FF", borderRadius:5, padding:"4px 10px", fontSize:12, color:"#2E7CF6", fontWeight:600 }} onClick={() => { setViewDoc(d); setModal("view"); }}><Icon n="eye" size={14} color="#2E7CF6"/> View</button>
                          : <span style={{ fontSize:11, color:"#F59E0B", fontWeight:600 }}>Not uploaded</span>}
                      </td>
                      <td style={C.td}>
                        {d.type === "Trip Sheet Scan" ? (
                          <div style={C.row}>
                            {d.fileData && <a href={d.fileData} download={d.fileName} style={C.iconBtn} title="Download"><Icon n="download" size={16} color="#10B981"/></a>}
                            <span style={{ fontSize:11, color:"#8B5CF6", fontWeight:600, padding:"2px 8px", background:"#F3F0FF", borderRadius:4 }}>Driver Upload</span>
                          </div>
                        ) : (
                          <div style={C.row}>
                            {d.fileData && <a href={d.fileData} download={d.fileName} style={C.iconBtn} title="Download"><Icon n="download" size={16} color="#10B981"/></a>}
                            <button style={C.iconBtn} title="Edit" onClick={() => { setF({...d}); setModal("edit"); }}><Icon n="edit" size={16} color="#F59E0B"/></button>
                            <button style={C.iconBtn} title="Delete" onClick={() => del(d.id)}><Icon n="trash" size={16} color="#EF4444"/></button>
                          </div>
                        )}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {/* ── Upload/Edit Modal ─────────────────────────────────────────── */}
      {(modal === "add" || modal === "edit") && (
        <Modal title={modal==="add"?"Upload Document":"Update Document"} onClose={() => setModal(null)}>
          <div style={C.form}>
            <div style={C.formGrid}>
              <FormField label="Vehicle *">
                <Sel value={f.vehicleId} onChange={e=>fSet("vehicleId",e.target.value)} options={[{value:"",label:"Select vehicle"},...vehicles.map(v=>({value:v.id,label:v.number}))]}/>
              </FormField>
              <FormField label="Document Type">
                <Sel value={f.type} onChange={e=>fSet("type",e.target.value)} options={ALL_DOC_TYPES_ORDERED}/>
              </FormField>
              <FormField label="Document Name *"><Inp value={f.name} onChange={e=>fSet("name",e.target.value)} placeholder="e.g. Insurance Policy 2025"/></FormField>
              <FormField label="Upload Date"><Inp type="date" value={f.uploadDate} onChange={e=>fSet("uploadDate",e.target.value)}/></FormField>
              <FormField label="Expiry Date (if applicable)"><Inp type="date" value={f.expiryDate} onChange={e=>fSet("expiryDate",e.target.value)}/></FormField>
            </div>
            {/* File upload */}
            <div style={{ marginTop:14, border:"2px dashed #D1D5DB", borderRadius:8, padding:"20px 16px", textAlign:"center", background:"#F8FAFC" }}>
              <div style={{ fontSize:13, color:"#64748B", marginBottom:10 }}>
                <Icon n="doc" size={20} color="#94A3B8"/>
                <div style={{ marginTop:6, fontWeight:600 }}>Upload Scanned Document</div>
                <div style={{ fontSize:11, color:"#94A3B8", marginTop:2 }}>Supports PDF, JPG, PNG (stored locally)</div>
              </div>
              <input
                type="file"
                accept=".pdf,.jpg,.jpeg,.png,.webp"
                id="docFileInput"
                style={{ display:"none" }}
                onChange={handleFileChange}
              />
              <label htmlFor="docFileInput" style={{ ...C.btn("ghost"), cursor:"pointer", display:"inline-flex" }}>
                {uploading ? "Reading file…" : f.fileData ? "Replace File" : "Choose File"}
              </label>
              {f.fileData && !uploading && (
                <div style={{ marginTop:10, display:"flex", alignItems:"center", justifyContent:"center", gap:8 }}>
                  <Icon n="check" size={15} color="#10B981"/>
                  <span style={{ fontSize:12, color:"#10B981", fontWeight:600 }}>{f.fileName}</span>
                  <button style={{ ...C.iconBtn, fontSize:11, color:"#EF4444" }} onClick={() => { fSet("fileData",""); fSet("fileName",""); }}>Remove</button>
                </div>
              )}
            </div>
            <div style={{ display:"flex", gap:10, justifyContent:"flex-end", marginTop:20 }}>
              <button style={C.btn("ghost")} onClick={() => setModal(null)}>Cancel</button>
              <button style={C.btn("primary")} onClick={save}>Save Document</button>
            </div>
          </div>
        </Modal>
      )}

      {/* ── Document Viewer Modal ─────────────────────────────────────── */}
      {modal === "view" && viewDoc && <DocViewerModal doc={viewDoc} onClose={() => { setModal(null); setViewDoc(null); }}/>}
    </div>
  );
}

// ─── Driver Management ─────────────────────────────────────────────────────────
function DriverForm({ driver, vehicles, onSave, onClose }) {
  const [f, setF] = useState(driver || { id:"D"+uid(), empId:"", name:"", mobile:"", licenseNo:"", licenseExpiry:"", vehicleId:"", status:"Available", address:"", active:true, loginLog:[] });
  const set = (k,v) => setF(p=>({...p,[k]:v}));
  return (
    <div style={C.form}>
      <div style={C.formGrid}>
        <FormField label="Employee ID *"><Inp value={f.empId} onChange={e=>set("empId",e.target.value)} placeholder="EMP101"/></FormField>
        <FormField label="Full Name *"><Inp value={f.name} onChange={e=>set("name",e.target.value)} placeholder="Rajesh Kumar"/></FormField>
        <FormField label="Registered Mobile (OTP) *"><Inp value={f.mobile} onChange={e=>set("mobile",e.target.value)} placeholder="9876543210" maxLength={10}/></FormField>
        <FormField label="License Number"><Inp value={f.licenseNo} onChange={e=>set("licenseNo",e.target.value)}/></FormField>
        <FormField label="License Expiry"><Inp type="date" value={f.licenseExpiry} onChange={e=>set("licenseExpiry",e.target.value)}/></FormField>
        <FormField label="Assign Vehicle">
          <Sel value={f.vehicleId} onChange={e=>set("vehicleId",e.target.value)} options={[{value:"",label:"— None —"},...vehicles.map(v=>({value:v.id,label:`${v.number} (${v.type})`}))]}/>
        </FormField>
        <FormField label="Operational Status"><Sel value={f.status} onChange={e=>set("status",e.target.value)} options={DRIVER_STATUSES}/></FormField>
        <FormField label="Address"><Inp value={f.address} onChange={e=>set("address",e.target.value)}/></FormField>
        <FormField label="System Access">
          <div style={{ display:"flex", alignItems:"center", gap:10, paddingTop:6 }}>
            <div
              onClick={() => set("active", !f.active)}
              style={{ width:40, height:22, borderRadius:99, background:f.active?"#10B981":"#D1D5DB", cursor:"pointer", position:"relative", transition:"background .2s" }}
            >
              <div style={{ position:"absolute", top:3, left:f.active?20:3, width:16, height:16, borderRadius:99, background:"#fff", transition:"left .2s", boxShadow:"0 1px 3px rgba(0,0,0,.2)" }}/>
            </div>
            <span style={{ fontSize:13, color:f.active?"#10B981":"#EF4444", fontWeight:600 }}>{f.active?"Active":"Deactivated"}</span>
          </div>
        </FormField>
      </div>
      <div style={{ display:"flex", gap:10, justifyContent:"flex-end", marginTop:20 }}>
        <button style={C.btn("ghost")} onClick={onClose}>Cancel</button>
        <button style={C.btn("primary")} onClick={() => { if(!f.empId||!f.name||!f.mobile) return alert("EmpID, name and mobile are required"); onSave(f); }}>Save Driver</button>
      </div>
    </div>
  );
}

function Drivers({ drivers, setDrivers, vehicles }) {
  const [modal, setModal] = useState(null);
  const [search, setSearch] = useState("");
  const [filterStatus, setFilterStatus] = useState("");

  const filtered = drivers.filter(d => {
    const q = search.toLowerCase();
    return (!q || d.name.toLowerCase().includes(q) || d.empId.toLowerCase().includes(q) || d.mobile.includes(q))
      && (!filterStatus || d.status === filterStatus);
  });

  const save = (d) => {
    setDrivers(p => p.find(x=>x.id===d.id) ? p.map(x=>x.id===d.id?d:x) : [...p,d]);
    setModal(null);
  };

  const del = (id) => { if (window.confirm("Delete driver?")) setDrivers(p=>p.filter(x=>x.id!==id)); };
  const getVehicle = (vid) => vehicles.find(v=>v.id===vid);
  const toggleAccess = (d) => setDrivers(p => p.map(x => x.id===d.id ? {...x, active:!x.active} : x));
  const resetAccess = (d) => { if (window.confirm(`Reset login access for ${d.name}? Their next login will require a fresh OTP.`)) { /* In production: invalidate sessions */ alert("Access reset. Driver must log in again via OTP."); } };

  return (
    <div>
      <div style={C.tableWrap}>
        <div style={C.tableHeader}>
          <span style={C.tableTitle}>Drivers ({filtered.length})</span>
          <button style={C.btn("primary")} onClick={() => setModal({ mode:"add" })}><Icon n="plus" size={16} color="#fff"/> Add Driver</button>
        </div>
        <div style={C.filterRow}>
          <SearchBox value={search} onChange={setSearch} placeholder="Search by name, Emp ID, mobile…"/>
          <select style={{ ...C.select, minWidth:150, width:"auto" }} value={filterStatus} onChange={e=>setFilterStatus(e.target.value)}>
            <option value="">All Statuses</option>
            {DRIVER_STATUSES.map(s=><option key={s}>{s}</option>)}
          </select>
        </div>
        <div style={{ overflowX:"auto" }}>
          <table style={C.table}>
            <thead><tr>
              {["Emp ID","Name","Mobile","License Expiry","Vehicle","Status","Access","Actions"].map(h=><th key={h} style={C.th}>{h}</th>)}
            </tr></thead>
            <tbody>
              {filtered.length===0 && <tr><td colSpan={8} style={{ ...C.td, textAlign:"center", color:"#94A3B8" }}>No drivers found</td></tr>}
              {filtered.map(d => {
                const v = getVehicle(d.vehicleId);
                return (
                  <tr key={d.id}>
                    <td style={C.td}><span style={{ fontFamily:"monospace", color:"#2E7CF6" }}>{d.empId}</span></td>
                    <td style={C.td}><strong>{d.name}</strong></td>
                    <td style={C.td}>{d.mobile || <span style={{color:"#EF4444",fontSize:12}}>No mobile!</span>}</td>
                    <td style={C.td}>
                      {d.licenseExpiry ? <span style={C.chip(statusColor(expiryStatus(d.licenseExpiry)))}>{fmtDate(d.licenseExpiry)}</span> : "—"}
                    </td>
                    <td style={C.td}>{v ? <span style={{ fontSize:12, fontWeight:500 }}>{v.number}</span> : <span style={{ color:"#94A3B8" }}>Unassigned</span>}</td>
                    <td style={C.td}><Badge status={d.status}/></td>
                    <td style={C.td}>
                      <div style={{ display:"flex", alignItems:"center", gap:6 }}>
                        <div
                          onClick={() => toggleAccess(d)}
                          title={d.active?"Click to deactivate":"Click to activate"}
                          style={{ width:36, height:20, borderRadius:99, background:d.active!==false?"#10B981":"#D1D5DB", cursor:"pointer", position:"relative", transition:"background .2s", flexShrink:0 }}
                        >
                          <div style={{ position:"absolute", top:2, left:d.active!==false?18:2, width:16, height:16, borderRadius:99, background:"#fff", transition:"left .2s", boxShadow:"0 1px 2px rgba(0,0,0,.2)" }}/>
                        </div>
                        <span style={{ fontSize:11, color:d.active!==false?"#10B981":"#EF4444", fontWeight:600 }}>{d.active!==false?"Active":"Off"}</span>
                      </div>
                    </td>
                    <td style={C.td}>
                      <div style={C.row}>
                        <button style={C.iconBtn} title="Edit Driver" onClick={() => setModal({ mode:"edit", driver:d })}><Icon n="edit" size={16} color="#2E7CF6"/></button>
                        <button style={C.iconBtn} title="View Login Activity" onClick={() => setModal({ mode:"log", driver:d })}><Icon n="eye" size={16} color="#8B5CF6"/></button>
                        <button style={C.iconBtn} title="Reset Access" onClick={() => resetAccess(d)}><Icon n="settings" size={16} color="#F59E0B"/></button>
                        <button style={C.iconBtn} title="Delete" onClick={() => del(d.id)}><Icon n="trash" size={16} color="#EF4444"/></button>
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
      {modal && modal.mode !== "log" && (
        <Modal title={modal.mode==="add"?"Add Driver":"Edit Driver"} onClose={() => setModal(null)}>
          <DriverForm driver={modal.driver} vehicles={vehicles} onSave={save} onClose={() => setModal(null)}/>
        </Modal>
      )}
      {modal && modal.mode === "log" && (
        <Modal title={`Login Activity — ${modal.driver.name}`} onClose={() => setModal(null)}>
          <div style={{ padding:"16px 24px 24px" }}>
            {(!modal.driver.loginLog || modal.driver.loginLog.length === 0) ? (
              <p style={{ color:"#94A3B8", fontSize:13 }}>No login activity recorded yet.</p>
            ) : (
              <table style={C.table}>
                <thead><tr>
                  <th style={C.th}>#</th>
                  <th style={C.th}>Employee ID</th>
                  <th style={C.th}>Login Timestamp</th>
                </tr></thead>
                <tbody>
                  {[...modal.driver.loginLog].reverse().map((l,i) => (
                    <tr key={i}>
                      <td style={C.td}>{modal.driver.loginLog.length - i}</td>
                      <td style={C.td}><span style={{ fontFamily:"monospace", color:"#2E7CF6" }}>{l.empId}</span></td>

                    </tr>
                  ))}

              </table>
            )}

        </Modal>
      )}
    </div>
  );
}

// ─── Trips ─────────────────────────────────────────────────────────────────────
function TripForm({ trip, vehicles, drivers, onSave, onClose }) {
  const defaultF = { id:"T"+uid(), sheetNo:"", vehicleType:"", vehicleId:"", driverId:"", passengerName:"", pickup:"", destination:"", purpose:"", date:"", startTime:"08:00", startKms:"", closeTime:"", closeKms:"", totalKms:"", totalTime:"", remarks:"", status:"Requested", requestedBy:"Admin", createdAt:today() };
  const [f, setF] = useState(trip || defaultF);
  const set = (k,v) => setF(p=>({...p,[k]:v}));

  // Auto-compute totals
  const handleKms = (k,v) => {
    const updated = {...f,[k]:v};
    if (updated.startKms && updated.closeKms) {
      const diff = Number(updated.closeKms) - Number(updated.startKms);
      if (diff >= 0) updated.totalKms = diff;
    }
    setF(updated);
  };

  const selectedVehicle = vehicles.find(v => v.id === f.vehicleId);

  return (
    <div style={C.form}>
      {/* Header info */}
      <div style={{ background:"#F8FAFC", border:"1px solid #E2E8F0", borderRadius:8, padding:"12px 16px", marginBottom:16, display:"flex", gap:16, alignItems:"center", flexWrap:"wrap" }}>
        <div style={{ fontWeight:700, fontSize:14, color:"#0F1C2E" }}>TRIP SHEET</div>
        <FormField label="Sheet No.">
          <Inp value={f.sheetNo} onChange={e=>set("sheetNo",e.target.value)} placeholder="629" style={{ ...C.input, width:100 }}/>
        </FormField>
        <FormField label="Status">
          <Sel value={f.status} onChange={e=>set("status",e.target.value)} options={TRIP_STATUSES}/>
        </FormField>
      </div>

      {/* Vehicle & Driver */}
      <div style={{ ...C.formGrid, marginBottom:14 }}>
        <FormField label="Type of Vehicle *">
          <Inp value={f.vehicleType} onChange={e=>set("vehicleType",e.target.value)} placeholder="e.g. Ertiga, SUV, Bus"/>
        </FormField>
        <FormField label="Vehicle (Number Plate) *">
          <Sel value={f.vehicleId} onChange={e=>{ set("vehicleId",e.target.value); const v=vehicles.find(x=>x.id===e.target.value); if(v) setF(p=>({...p,vehicleId:e.target.value,vehicleType:v.type})); }} options={[{value:"",label:"— Select —"},...vehicles.map(v=>({value:v.id,label:`${v.number} (${v.type})`}))]}/>
        </FormField>
        <FormField label="Driver's Name *">
          <Sel value={f.driverId} onChange={e=>set("driverId",e.target.value)} options={[{value:"",label:"— Select —"},...drivers.map(d=>({value:d.id,label:d.name}))]}/>
        </FormField>
        <FormField label="Passenger Name *">
          <Inp value={f.passengerName} onChange={e=>set("passengerName",e.target.value)} placeholder="Name / Designation"/>
        </FormField>
        <FormField label="From (Pickup) *">
          <Inp value={f.pickup} onChange={e=>set("pickup",e.target.value)} placeholder="GITAM Campus"/>
        </FormField>
        <FormField label="To (Destination) *">
          <Inp value={f.destination} onChange={e=>set("destination",e.target.value)} placeholder="Bengaluru"/>
        </FormField>
        <FormField label="Purpose of Travel">
          <Inp value={f.purpose} onChange={e=>set("purpose",e.target.value)} placeholder="Official duty"/>
        </FormField>
        <FormField label="Requested By">
          <Inp value={f.requestedBy} onChange={e=>set("requestedBy",e.target.value)}/>
        </FormField>
      </div>

      {/* Trip log table — mirrors physical form */}
      <div style={{ border:"1px solid #D1D5DB", borderRadius:8, overflow:"hidden", marginBottom:16 }}>
        <div style={{ background:"#F1F5F9", padding:"8px 14px", fontSize:12, fontWeight:700, color:"#374151", borderBottom:"1px solid #D1D5DB" }}>TRIP LOG</div>
        <div style={{ overflowX:"auto" }}>
          <table style={{ width:"100%", borderCollapse:"collapse" }}>
            <thead>
              <tr style={{ background:"#F8FAFC" }}>
                {["Date","Starting Time","Starting KMS","Closing Time","Closing KMS","Total KMS","Total Time","Remarks"].map(h => (
                  <th key={h} style={{ ...C.th, whiteSpace:"nowrap" }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              <tr>
                <td style={{ ...C.td, minWidth:130 }}><Inp type="date" value={f.date} onChange={e=>set("date",e.target.value)} style={{ ...C.input, padding:"6px 8px", width:"100%" }}/></td>
                <td style={{ ...C.td, minWidth:110 }}><Inp type="time" value={f.startTime} onChange={e=>set("startTime",e.target.value)} style={{ ...C.input, padding:"6px 8px", width:"100%" }}/></td>
                <td style={{ ...C.td, minWidth:110 }}><Inp type="number" value={f.startKms} onChange={e=>handleKms("startKms",e.target.value)} placeholder="75763" style={{ ...C.input, padding:"6px 8px", width:"100%" }}/></td>
                <td style={{ ...C.td, minWidth:110 }}><Inp type="time" value={f.closeTime} onChange={e=>set("closeTime",e.target.value)} style={{ ...C.input, padding:"6px 8px", width:"100%" }}/></td>
                <td style={{ ...C.td, minWidth:110 }}><Inp type="number" value={f.closeKms} onChange={e=>handleKms("closeKms",e.target.value)} placeholder="75880" style={{ ...C.input, padding:"6px 8px", width:"100%" }}/></td>
                <td style={{ ...C.td, minWidth:90, background:"#F0FDF4" }}><strong style={{ color:"#15803D" }}>{f.totalKms || "—"}</strong></td>
                <td style={{ ...C.td, minWidth:110 }}><Inp value={f.totalTime} onChange={e=>set("totalTime",e.target.value)} placeholder="7.15 Hours" style={{ ...C.input, padding:"6px 8px", width:"100%" }}/></td>
                <td style={{ ...C.td, minWidth:140 }}><Inp value={f.remarks} onChange={e=>set("remarks",e.target.value)} placeholder="Optional" style={{ ...C.input, padding:"6px 8px", width:"100%" }}/></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div style={{ display:"flex", gap:10, justifyContent:"flex-end", marginTop:20 }}>
        <button style={C.btn("ghost")} onClick={onClose}>Cancel</button>
        <button style={C.btn("primary")} onClick={() => { if(!f.date||!f.pickup||!f.destination||!f.passengerName) return alert("Date, passenger, pickup & destination required"); onSave(f); }}>Save Trip Sheet</button>
      </div>
    </div>
  );
}

function Trips({ trips, setTrips, vehicles, drivers }) {
  const [modal, setModal] = useState(null);
  const [search, setSearch] = useState("");
  const [filterStatus, setFilterStatus] = useState("");
  const [filterDate, setFilterDate] = useState("");

  const filtered = trips.filter(t => {
    const q = search.toLowerCase();
    return (!q || t.id.toLowerCase().includes(q) || t.pickup.toLowerCase().includes(q) || t.destination.toLowerCase().includes(q) || t.purpose.toLowerCase().includes(q))
      && (!filterStatus || t.status === filterStatus)
      && (!filterDate || t.date === filterDate);
  }).sort((a,b) => b.date.localeCompare(a.date));

  const save = (t) => {
    setTrips(p => p.find(x=>x.id===t.id) ? p.map(x=>x.id===t.id?t:x) : [...p,t]);
    setModal(null);
  };
  const del = (id) => { if (window.confirm("Delete trip?")) setTrips(p=>p.filter(x=>x.id!==id)); };
  const getV = (id) => vehicles.find(v=>v.id===id);
  const getD = (id) => drivers.find(d=>d.id===id);

  const quickStatus = (trip, newStatus) => {
    setTrips(p => p.map(x => x.id===trip.id ? {...x, status:newStatus} : x));
  };

  return (
    <div>
      <div style={C.tableWrap}>
        <div style={C.tableHeader}>
          <span style={C.tableTitle}>Trip Sheets ({filtered.length})</span>
          <button style={C.btn("primary")} onClick={() => setModal({ mode:"add" })}><Icon n="plus" size={16} color="#fff"/> New Trip Sheet</button>
        </div>
        <div style={C.filterRow}>
          <SearchBox value={search} onChange={setSearch} placeholder="Search trip ID, route, purpose…"/>
          <select style={{ ...C.select, minWidth:160, width:"auto" }} value={filterStatus} onChange={e=>setFilterStatus(e.target.value)}>
            <option value="">All Statuses</option>
            {TRIP_STATUSES.map(s=><option key={s}>{s}</option>)}
          </select>
          <input type="date" style={{ ...C.input, minWidth:140 }} value={filterDate} onChange={e=>setFilterDate(e.target.value)}/>
          {filterDate && <button style={{ ...C.iconBtn, fontSize:12, color:"#64748B" }} onClick={()=>setFilterDate("")}>Clear date</button>}
        </div>
        <div style={{ overflowX:"auto" }}>
          <table style={C.table}>
            <thead><tr>
              {["Sheet No.","Date","Vehicle","Driver","Passenger","Route","Start KMS","Close KMS","Total KMS","Status","Actions"].map(h=><th key={h} style={C.th}>{h}</th>)}
            </tr></thead>
            <tbody>
              {filtered.length===0 && <tr><td colSpan={11} style={{ ...C.td, textAlign:"center", color:"#94A3B8" }}>No trip sheets found</td></tr>}
              {filtered.map(t => {
                const v = getV(t.vehicleId);
                const d = getD(t.driverId);
                return (
                  <tr key={t.id}>
                    <td style={C.td}><span style={{ fontFamily:"monospace", fontSize:12, color:"#2E7CF6", fontWeight:700 }}>{t.sheetNo || t.id}</span></td>
                    <td style={C.td}><span style={{ fontSize:12 }}>{fmtDate(t.date)}<br/><span style={{ color:"#64748B", fontSize:11 }}>{t.startTime} – {t.closeTime}</span></span></td>
                    <td style={C.td}><span style={{ fontSize:12 }}>{t.vehicleType}<br/><span style={{ color:"#2E7CF6", fontSize:11, fontWeight:500 }}>{v ? v.number : "—"}</span></span></td>
                    <td style={C.td}><span style={{ fontSize:12 }}>{d ? d.name : <span style={{ color:"#94A3B8" }}>—</span>}</span></td>
                    <td style={C.td}><span style={{ fontSize:12 }}>{t.passengerName || "—"}</span></td>
                    <td style={C.td}><span style={{ fontSize:12 }}>{t.pickup}<br/>→ {t.destination}</span></td>
                    <td style={C.td}>{t.startKms || "—"}</td>
                    <td style={C.td}>{t.closeKms || "—"}</td>
                    <td style={C.td}><strong style={{ color:"#15803D" }}>{t.totalKms || "—"}</strong></td>
                    <td style={C.td}><Badge status={t.status}/></td>
                    <td style={C.td}>
                      <div style={C.row}>
                        {t.status === "Requested" && <button style={{ ...C.btn("success"), padding:"4px 10px", fontSize:11 }} onClick={() => quickStatus(t,"Approved")}><Icon n="check" size={12} color="#fff"/>Approve</button>}
                        {t.status === "Approved" && <button style={{ ...C.btn("primary"), padding:"4px 10px", fontSize:11 }} onClick={() => quickStatus(t,"Trip Started")}>Start</button>}
                        {t.status === "Trip Started" && <button style={{ ...C.btn("ghost"), padding:"4px 10px", fontSize:11 }} onClick={() => quickStatus(t,"Trip Completed")}>End</button>}
                        <button style={C.iconBtn} onClick={() => setModal({ mode:"edit", trip:t })}><Icon n="edit" size={15} color="#2E7CF6"/></button>
                        <button style={C.iconBtn} onClick={() => del(t.id)}><Icon n="trash" size={15} color="#EF4444"/></button>
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
      {modal && (
        <Modal title={modal.mode==="add"?"New Trip Sheet":"Edit Trip Sheet"} onClose={() => setModal(null)} wide>
          <TripForm trip={modal.trip} vehicles={vehicles} drivers={drivers} onSave={save} onClose={() => setModal(null)}/>
        </Modal>
      )}
    </div>
  );
}

// ─── Reports ───────────────────────────────────────────────────────────────────
function Reports({ trips, vehicles, drivers }) {
  const [type, setType] = useState("trips");
  const [from, setFrom] = useState("");
  const [to, setTo] = useState("");

  const inRange = (date) => (!from || date >= from) && (!to || date <= to);

  const filtered = trips.filter(t => inRange(t.date));

  const tripByStatus = TRIP_STATUSES.map(s => ({ status:s, count:filtered.filter(t=>t.status===s).length })).filter(x=>x.count>0);

  const vehicleUtil = vehicles.map(v => ({
    number:v.number, type:v.type,
    trips:filtered.filter(t=>t.vehicleId===v.id).length,
    status:v.status
  }));

  const driverUtil = drivers.map(d => ({
    name:d.name, empId:d.empId,
    trips:filtered.filter(t=>t.driverId===d.id).length,
    status:d.status
  }));

  const expiryReport = [];
  vehicles.forEach(v => {
    [["insuranceExpiry","Insurance"],["pucExpiry","PUC"],["fitnessExpiry","Fitness"],["roadTaxExpiry","Road Tax"],["permitExpiry","Permit"]].forEach(([k,label]) => {
      if (v[k]) expiryReport.push({ vehicle:v.number, doc:label, expiry:v[k], status:expiryStatus(v[k]), days:daysUntil(v[k]) });
    });
  });

  return (
    <div>
      <div style={{ ...C.tableWrap, marginBottom:16 }}>
        <div style={C.tableHeader}>
          <span style={C.tableTitle}>Reports</span>
          <button style={C.btn("ghost")} onClick={() => alert("Export functionality — in production this generates CSV/PDF")}><Icon n="download" size={16} color="#2E7CF6"/> Export</button>
        </div>
        <div style={C.filterRow}>
          <div style={{ display:"flex", gap:6 }}>
            {[["trips","Trip Summary"],["vehicles","Vehicle Utilisation"],["drivers","Driver Utilisation"],["expiry","Document Expiry"]].map(([k,l]) => (
              <button key={k} onClick={() => setType(k)} style={{ padding:"6px 14px", borderRadius:6, border:"1px solid", borderColor:type===k?"#2E7CF6":"#D1D5DB", background:type===k?"#2E7CF6":"#fff", color:type===k?"#fff":"#374151", fontSize:13, fontWeight:500, cursor:"pointer" }}>{l}</button>
            ))}
          </div>
          <div style={{ marginLeft:"auto", display:"flex", gap:8, alignItems:"center" }}>
            <span style={{ fontSize:12, color:"#64748B" }}>From:</span>
            <input type="date" style={{ ...C.input, padding:"6px 10px" }} value={from} onChange={e=>setFrom(e.target.value)}/>
            <span style={{ fontSize:12, color:"#64748B" }}>To:</span>
            <input type="date" style={{ ...C.input, padding:"6px 10px" }} value={to} onChange={e=>setTo(e.target.value)}/>
          </div>
        </div>
      </div>

      {type === "trips" && (
        <div style={C.tableWrap}>
          <div style={{ padding:"12px 20px", borderBottom:"1px solid #E2E8F0" }}>
            <div style={{ display:"flex", gap:12, flexWrap:"wrap" }}>
              {tripByStatus.map(x => <div key={x.status} style={{ ...C.statCard(statusColor(x.status)), padding:"12px 18px", minWidth:120 }}><div style={C.statNum}>{x.count}</div><div style={C.statLabel}>{x.status}</div></div>)}
            </div>
          </div>
          <table style={C.table}>
            <thead><tr>{["Sheet No.","Date","Vehicle","Driver","Passenger","Route","Total KMS","Status"].map(h=><th key={h} style={C.th}>{h}</th>)}</tr></thead>
            <tbody>
              {filtered.length===0 && <tr><td colSpan={8} style={{ ...C.td, textAlign:"center", color:"#94A3B8" }}>No trip sheets in selected range</td></tr>}
              {filtered.map(t => (
                <tr key={t.id}>
                  <td style={C.td}><span style={{ fontFamily:"monospace", fontSize:12, color:"#2E7CF6", fontWeight:700 }}>{t.sheetNo || t.id}</span></td>
                  <td style={C.td}>{fmtDate(t.date)}</td>
                  <td style={C.td}>{vehicles.find(v=>v.id===t.vehicleId)?.number || "—"}</td>
                  <td style={C.td}>{drivers.find(d=>d.id===t.driverId)?.name || "—"}</td>
                  <td style={C.td}>{t.passengerName || "—"}</td>
                  <td style={C.td}><span style={{ fontSize:12 }}>{t.pickup} → {t.destination}</span></td>
                  <td style={C.td}><strong style={{ color:"#15803D" }}>{t.totalKms || "—"}</strong></td>
                  <td style={C.td}><Badge status={t.status}/></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}

      {type === "vehicles" && (
        <div style={C.tableWrap}>
          <table style={C.table}>
            <thead><tr>{["Vehicle No.","Type","Status","Trips Completed"].map(h=><th key={h} style={C.th}>{h}</th>)}</tr></thead>
            <tbody>
              {vehicleUtil.map(v => (
                <tr key={v.number}>
                  <td style={C.td}><strong>{v.number}</strong></td>
                  <td style={C.td}>{v.type}</td>
                  <td style={C.td}><Badge status={v.status}/></td>
                  <td style={C.td}><strong style={{ color:"#2E7CF6" }}>{v.trips}</strong></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}

      {type === "drivers" && (
        <div style={C.tableWrap}>
          <table style={C.table}>
            <thead><tr>{["Emp ID","Name","Status","Trips Handled"].map(h=><th key={h} style={C.th}>{h}</th>)}</tr></thead>
            <tbody>
              {driverUtil.map(d => (
                <tr key={d.empId}>
                  <td style={C.td}><span style={{ fontFamily:"monospace", color:"#2E7CF6" }}>{d.empId}</span></td>
                  <td style={C.td}><strong>{d.name}</strong></td>
                  <td style={C.td}><Badge status={d.status}/></td>
                  <td style={C.td}><strong style={{ color:"#2E7CF6" }}>{d.trips}</strong></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}

      {type === "expiry" && (
        <div style={C.tableWrap}>
          <table style={C.table}>
            <thead><tr>{["Vehicle","Document","Expiry Date","Days Left","Status"].map(h=><th key={h} style={C.th}>{h}</th>)}</tr></thead>
            <tbody>
              {expiryReport.sort((a,b)=>a.days-b.days).map((r,i) => (
                <tr key={i} style={{ background:r.status==="Expired"?"#FEF2F2":r.status==="Expiring Soon"?"#FFFBEB":"" }}>
                  <td style={C.td}><strong>{r.vehicle}</strong></td>
                  <td style={C.td}>{r.doc}</td>
                  <td style={C.td}>{fmtDate(r.expiry)}</td>

                  <td style={C.td}><Badge status={r.status}/></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

      </div>
      {viewDoc && <DocViewerModal doc={viewDoc} onClose={() => setViewDoc(null)}/>}
