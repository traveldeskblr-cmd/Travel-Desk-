}

// ─── Driver Trip Sheet ─────────────────────────────────────────────────────────
function DriverTripSheet({ driver, vehicle, trips, setTrips }) {
  const actionable = trips.filter(t => ["Approved","Vehicle Assigned","Driver Assigned","Trip Started","Trip Completed"].includes(t.status));
  const [selected, setSelected] = useState(actionable[0]?.id || null);
  const [editing, setEditing] = useState(false);
  const [form, setForm] = useState({});
  const [saved, setSaved] = useState(false);

  const trip = trips.find(t => t.id === selected);

  const openEdit = (t) => {
    setForm({
      startTime: t.startTime || "",
      startKms: t.startKms || "",
      closeTime: t.closeTime || "",
      closeKms: t.closeKms || "",
      totalTime: t.totalTime || "",
      remarks: t.remarks || "",
    });
    setEditing(true);
    setSaved(false);
  };

  const computeKms = (f) => {
    const s = Number(f.startKms), c = Number(f.closeKms);
    return (s && c && c >= s) ? c - s : null;
  };

  const save = () => {
    const totalKms = computeKms(form);
    let newStatus = trip.status;
    if (trip.status === "Approved" || trip.status === "Vehicle Assigned" || trip.status === "Driver Assigned") {
      if (form.startKms && form.startTime) newStatus = "Trip Started";
    }
    if (trip.status === "Trip Started" && form.closeKms && form.closeTime) {
      newStatus = "Trip Completed";
    }
    setTrips(p => p.map(t => t.id === selected
      ? { ...t, ...form, totalKms: totalKms ?? t.totalKms, status: newStatus }
      : t
    ));
    setEditing(false);
    setSaved(true);
  };

  const fSet = (k, v) => setForm(p => ({ ...p, [k]: v }));

  if (actionable.length === 0) {
    return (
      <div style={{ ...C.tableWrap, padding:40, textAlign:"center" }}>
        <Icon n="trip" size={36} color="#CBD5E1"/>
        <div style={{ marginTop:12, color:"#94A3B8", fontSize:14 }}>No active or upcoming trips assigned to you.</div>
      </div>
    );
  }

  return (
    <div>
      {/* Trip selector */}
      <div style={{ display:"flex", gap:10, marginBottom:16, flexWrap:"wrap" }}>
        {actionable.map(t => (
          <button key={t.id}
            style={{ padding:"8px 14px", borderRadius:8, border:"2px solid", fontSize:13, fontWeight:600, cursor:"pointer",
              borderColor: selected===t.id ? "#2E7CF6" : "#E2E8F0",
              background: selected===t.id ? "#EFF6FF" : "#fff",
              color: selected===t.id ? "#2E7CF6" : "#374151" }}
            onClick={() => { setSelected(t.id); setEditing(false); setSaved(false); }}
          >
            #{t.sheetNo || t.id} · {t.destination}
          </button>
        ))}
      </div>

      {trip && (
        <div style={{ background:"#fff", borderRadius:12, boxShadow:"0 1px 4px rgba(0,0,0,.06)", overflow:"hidden" }}>
          {/* Trip header */}
          <div style={{ background:"#0F1C2E", padding:"16px 24px", display:"flex", justifyContent:"space-between", alignItems:"center", flexWrap:"wrap", gap:10 }}>
            <div>
              <div style={{ color:"#fff", fontWeight:700, fontSize:16 }}>Trip Sheet #{trip.sheetNo || trip.id}</div>
              <div style={{ color:"#94A3B8", fontSize:12, marginTop:2 }}>{fmtDate(trip.date)} · {trip.purpose || "Official Travel"}</div>
            </div>
            <Badge status={trip.status}/>
          </div>

          {/* Trip info grid */}
          <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))", gap:0, borderBottom:"1px solid #E2E8F0" }}>
            {[
              ["Passenger", trip.passengerName || "—"],
              ["From", trip.pickup],
              ["To", trip.destination],
              ["Vehicle", vehicle ? `${vehicle.number} (${vehicle.type})` : trip.vehicleType || "—"],
            ].map(([label, val]) => (
              <div key={label} style={{ padding:"14px 20px", borderRight:"1px solid #F1F5F9" }}>
                <div style={{ fontSize:11, color:"#64748B", marginBottom:3 }}>{label}</div>
                <div style={{ fontSize:13, fontWeight:600, color:"#0F1C2E" }}>{val}</div>
              </div>
            ))}
          </div>

          {/* Trip log section */}
          <div style={{ padding:"20px 24px" }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16 }}>
              <div style={{ fontSize:14, fontWeight:700, color:"#0F1C2E" }}>Trip Log</div>
              {!editing && (
                <button style={C.btn("primary")} onClick={() => openEdit(trip)}>
                  <Icon n="edit" size={14} color="#fff"/> {trip.startKms ? "Update Details" : "Fill Trip Details"}
                </button>
              )}
            </div>

            {saved && !editing && (
              <div style={{ ...C.alertBar("info"), marginBottom:12 }}>
                <Icon n="check" size={15} color="#2E7CF6"/>
                <div style={C.alertText}>Trip details saved successfully.</div>
              </div>
            )}

            {!editing ? (
              /* Read-only view */
              <div style={{ overflowX:"auto" }}>
                <table style={{ ...C.table, border:"1px solid #E2E8F0", borderRadius:8 }}>
                  <thead>
                    <tr style={{ background:"#F8FAFC" }}>
                      {["Start Time","Start KMS","Close Time","Close KMS","Total KMS","Total Time","Remarks"].map(h => (
                        <th key={h} style={{ ...C.th, whiteSpace:"nowrap" }}>{h}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td style={C.td}>{trip.startTime || <span style={{ color:"#CBD5E1" }}>—</span>}</td>
                      <td style={C.td}>{trip.startKms || <span style={{ color:"#CBD5E1" }}>—</span>}</td>
                      <td style={C.td}>{trip.closeTime || <span style={{ color:"#CBD5E1" }}>—</span>}</td>
                      <td style={C.td}>{trip.closeKms || <span style={{ color:"#CBD5E1" }}>—</span>}</td>
                      <td style={{ ...C.td, background:"#F0FDF4" }}>
                        {trip.totalKms ? <strong style={{ color:"#15803D" }}>{trip.totalKms} km</strong> : <span style={{ color:"#CBD5E1" }}>—</span>}
                      </td>
                      <td style={C.td}>{trip.totalTime || <span style={{ color:"#CBD5E1" }}>—</span>}</td>
                      <td style={C.td}>{trip.remarks || <span style={{ color:"#CBD5E1" }}>—</span>}</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            ) : (
              /* Edit form */
              <div>
                <div style={{ background:"#FFF7ED", border:"1px solid #FED7AA", borderRadius:8, padding:"10px 14px", marginBottom:16, fontSize:12, color:"#92400E" }}>
                  <strong>Instructions:</strong> Fill in the trip details below. Entering start details will mark the trip as Started; entering close details will mark it Completed.
                </div>
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:14, marginBottom:14 }}>
                  <FormField label="Start Time">
                    <Inp type="time" value={form.startTime} onChange={e => fSet("startTime", e.target.value)}/>
                  </FormField>
                  <FormField label="Start KMS *">
                    <Inp type="number" value={form.startKms} onChange={e => fSet("startKms", e.target.value)} placeholder="e.g. 75763"/>
                  </FormField>
                  <div/>
                  <FormField label="Close Time">
                    <Inp type="time" value={form.closeTime} onChange={e => fSet("closeTime", e.target.value)}/>
                  </FormField>
                  <FormField label="Close KMS">
                    <Inp type="number" value={form.closeKms} onChange={e => fSet("closeKms", e.target.value)} placeholder="e.g. 75880"/>
                  </FormField>
                  <FormField label="Total KMS">
                    <div style={{ padding:"9px 12px", background:"#F0FDF4", border:"1px solid #D1FAE5", borderRadius:7, fontSize:13, fontWeight:700, color:"#15803D" }}>
                      {computeKms(form) !== null ? `${computeKms(form)} km` : "Auto-calculated"}
                    </div>
                  </FormField>
                  <FormField label="Total Time">
                    <Inp value={form.totalTime} onChange={e => fSet("totalTime", e.target.value)} placeholder="e.g. 7.15 Hours"/>
                  </FormField>
                  <FormField label="Remarks" >
                    <Inp value={form.remarks} onChange={e => fSet("remarks", e.target.value)} placeholder="Optional notes"/>
                  </FormField>
                </div>
                <div style={{ display:"flex", gap:10, justifyContent:"flex-end" }}>
                  <button style={C.btn("ghost")} onClick={() => setEditing(false)}>Cancel</button>
                  <button style={C.btn("primary")} onClick={save}>
                    <Icon n="check" size={14} color="#fff"/> Save Trip Sheet
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

// ─── Driver Trip Sheet Form ────────────────────────────────────────────────────
function DriverTripSheetForm({ driver, vehicle, trips, setTrips, docs, setDocs }) {
  const [selectedTripId, setSelectedTripId] = useState(trips[0]?.id || null);
  const [editing, setEditing] = useState(false);
  const [form, setForm] = useState({});
  const [saved, setSaved] = useState(false);
  const [scanUploading, setScanUploading] = useState(false);
  const [scanFile, setScanFile] = useState({ fileData:"", fileName:"" });
  const [viewScan, setViewScan] = useState(null);
  const [showNewForm, setShowNewForm] = useState(false);
  const [newForm, setNewForm] = useState({ sheetNo:"", passengerName:"", pickup:"GITAM", destination:"", date: today(), startTime:"", startKms:"", closeTime:"", closeKms:"", totalTime:"", remarks:"", purpose:"Official Travel" });
  const nSet = (k,v) => setNewForm(p => ({...p,[k]:v}));
  const computeNewKms = () => { const s=Number(newForm.startKms),c=Number(newForm.closeKms); return (s&&c&&c>=s)?c-s:null; };

  const submitNewTrip = () => {
    if (!newForm.passengerName.trim()) { alert("Passenger name is required"); return; }
    if (!newForm.destination.trim()) { alert("Destination is required"); return; }
    if (!newForm.startKms) { alert("Starting KMS is required"); return; }
    const totalKms = computeNewKms();
    let status = "Trip Started";
    if (newForm.closeKms && newForm.closeTime) status = "Trip Completed";
    const newTrip = {
      id: "T" + uid(),
      sheetNo: newForm.sheetNo || String(Date.now()).slice(-4),
      vehicleType: vehicle?.type || "",
      vehicleId: vehicle?.id || "",
      driverId: driver.id,
      passengerName: newForm.passengerName,
      pickup: newForm.pickup,
      destination: newForm.destination,
      purpose: newForm.purpose,
      date: newForm.date,
      startTime: newForm.startTime,
      startKms: Number(newForm.startKms),
      closeTime: newForm.closeTime,
      closeKms: newForm.closeKms ? Number(newForm.closeKms) : "",
      totalKms: totalKms ?? "",
      totalTime: newForm.totalTime,
      remarks: newForm.remarks,
      status,
      requestedBy: driver.name,
      createdAt: today(),
    };
    setTrips(p => [...p, newTrip]);
    setSelectedTripId(newTrip.id);
    setShowNewForm(false);
    setNewForm({ sheetNo:"", passengerName:"", pickup:"GITAM", destination:"", date:today(), startTime:"", startKms:"", closeTime:"", closeKms:"", totalTime:"", remarks:"", purpose:"Official Travel" });
    setSaved(true);
  };

  const trip = trips.find(t => t.id === selectedTripId);
  const existingScan = trip ? docs.find(d => d.tripId === trip.id && d.type === "Trip Sheet Scan") : null;

  const openEdit = (t) => {
    setForm({
      sheetNo: t.sheetNo || "",
      vehicleType: t.vehicleType || (vehicle ? vehicle.type : ""),
      vehicleNumber: vehicle ? vehicle.number : "",
      passengerName: t.passengerName || "",
      pickup: t.pickup || "",
      destination: t.destination || "",
      date: t.date || today(),
      startTime: t.startTime || "",
      startKms: t.startKms || "",
      closeTime: t.closeTime || "",
      closeKms: t.closeKms || "",
      totalTime: t.totalTime || "",
      remarks: t.remarks || "",
    });
    setEditing(true);
    setSaved(false);
  };

  const computeKms = () => {
    const s = Number(form.startKms), c = Number(form.closeKms);
    return (s && c && c >= s) ? c - s : null;
  };

  const fSet = (k, v) => setForm(p => ({ ...p, [k]: v }));

  const save = () => {
    const totalKms = computeKms();
    let newStatus = trip.status;
    if (["Approved","Vehicle Assigned","Driver Assigned"].includes(trip.status)) {
      if (form.startKms && form.startTime) newStatus = "Trip Started";
    }
    if (trip.status === "Trip Started" && form.closeKms && form.closeTime) newStatus = "Trip Completed";
    setTrips(p => p.map(t => t.id === selectedTripId
      ? { ...t, ...form, totalKms: totalKms ?? t.totalKms, status: newStatus }
      : t
    ));
    setEditing(false);
    setSaved(true);
  };

  const handleScanUpload = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setScanUploading(true);
    const reader = new FileReader();
    reader.onload = ev => { setScanFile({ fileData: ev.target.result, fileName: file.name }); setScanUploading(false); };
    reader.readAsDataURL(file);
  };

  const saveScan = () => {
    if (!scanFile.fileData || !trip) return;
    const newDoc = {
      id: existingScan ? existingScan.id : "DOC" + uid(),
      vehicleId: vehicle?.id || "",
      tripId: trip.id,
      name: `Trip Sheet #${trip.sheetNo || trip.id}`,
      type: "Trip Sheet Scan",
      uploadDate: today(),
      expiryDate: "",
      status: "Valid",
      fileName: scanFile.fileName,
      fileData: scanFile.fileData,
      uploadedBy: driver.name,
    };
    setDocs(p => existingScan ? p.map(d => d.id===existingScan.id ? newDoc : d) : [...p, newDoc]);
    setScanFile({ fileData:"", fileName:"" });
    alert("Scan uploaded successfully! Admin can now view it.");
  };

  // GITAM form style
  const TS = {
    wrap: { background:"#fff", borderRadius:12, boxShadow:"0 1px 8px rgba(0,0,0,.08)", overflow:"hidden", marginBottom:20 },
    formWrap: { background:"#fff", border:"2px solid #1A2C42", borderRadius:8, margin:20, overflow:"hidden" },
    header: { display:"flex", alignItems:"center", padding:"10px 16px", borderBottom:"2px solid #1A2C42", background:"#fff", gap:16 },
    logoBox: { display:"flex", alignItems:"center", gap:10 },

    sheetTitle: { flex:1, textAlign:"center" },

    row: { display:"grid", gridTemplateColumns:"160px 1fr", borderBottom:"1px solid #CBD5E1" },
    rowLabel: { padding:"9px 12px", fontSize:12, fontWeight:700, color:"#1A2C42", background:"#F8FAFC", borderRight:"1px solid #CBD5E1" },
    rowVal: { padding:"9px 12px", fontSize:13, color:"#0F1C2E", fontWeight:600 },

    tableHead: { display:"grid", gridTemplateColumns:"90px 90px 90px 90px 90px 90px 90px 1fr", background:"#0F1C2E" },
    tableRow: { display:"grid", gridTemplateColumns:"90px 90px 90px 90px 90px 90px 90px 1fr", borderBottom:"1px solid #CBD5E1" },
    th: { padding:"8px 6px", fontSize:10, fontWeight:700, color:"#fff", textAlign:"center", borderRight:"1px solid #1F3048" },
    td: { padding:"8px 6px", fontSize:12, textAlign:"center", borderRight:"1px solid #E2E8F0", color:"#0F1C2E", fontWeight:600 },
    tdInp: { padding:"6px 4px", border:"none", outline:"none", fontSize:12, width:"100%", textAlign:"center", background:"transparent", fontWeight:600 },
    sigRow: { display:"grid", gridTemplateColumns:"1fr 1fr", borderTop:"2px solid #1A2C42" },
    sigCell: { padding:"12px 16px" },
  };

  return (
    <div>
      {/* New Trip Sheet button */}
      <div style={{ display:"flex", justifyContent:"flex-end", marginBottom:12 }}>
        <button style={C.btn("primary")} onClick={() => { setShowNewForm(s=>!s); setEditing(false); }}>
          <Icon n="plus" size={15} color="#fff"/> {showNewForm ? "Cancel" : "New Trip Sheet"}
        </button>
      </div>

      {/* New Trip Sheet Form */}
      {showNewForm && (
        <div style={{ background:"#fff", borderRadius:12, boxShadow:"0 1px 8px rgba(0,0,0,.08)", padding:"20px 24px", marginBottom:20 }}>

                    <div style={TS.rowVal}>
                      {editing && field
                        ? <input style={TS.rowInp} value={form[field] || ""} onChange={e => fSet(field, e.target.value)}/>
                        : val}
                    </div>
                  </div>
                ))}

                {/* KMS/Time table */}
                <div style={TS.tableHead}>
                  {["DATE","STARTING TIME","STARTING KMS","CLOSING TIME","CLOSING KMS","TOTAL KMS","TOTAL TIME","REMARKS"].map(h => (
                    <div key={h} style={TS.th}>{h}</div>
                  ))}
                </div>
                <div style={TS.tableRow}>
                  {/* Date */}
                  <div style={TS.td}>
                    {editing
                      ? <input type="date" style={{ ...TS.tdInp, fontSize:10 }} value={form.date} onChange={e=>fSet("date",e.target.value)}/>
                      : fmtDate(trip.date)}
                  </div>
                  {/* Start Time */}
                  <div style={TS.td}>
                    {editing
                      ? <input type="time" style={TS.tdInp} value={form.startTime} onChange={e=>fSet("startTime",e.target.value)}/>
                      : trip.startTime || <span style={{ color:"#CBD5E1" }}>—</span>}
                  </div>
                  {/* Start KMS */}
                  <div style={TS.td}>
                    {editing
                      ? <input type="number" style={TS.tdInp} value={form.startKms} onChange={e=>fSet("startKms",e.target.value)} placeholder="KMS"/>
                      : trip.startKms || <span style={{ color:"#CBD5E1" }}>—</span>}
                  </div>
                  {/* Close Time */}
                  <div style={TS.td}>
                    {editing
                      ? <input type="time" style={TS.tdInp} value={form.closeTime} onChange={e=>fSet("closeTime",e.target.value)}/>
                      : trip.closeTime || <span style={{ color:"#CBD5E1" }}>—</span>}
                  </div>
                  {/* Close KMS */}
                  <div style={TS.td}>
                    {editing
                      ? <input type="number" style={TS.tdInp} value={form.closeKms} onChange={e=>fSet("closeKms",e.target.value)} placeholder="KMS"/>
                      : trip.closeKms || <span style={{ color:"#CBD5E1" }}>—</span>}
                  </div>
                  {/* Total KMS - auto */}
                  <div style={{ ...TS.td, background:"#F0FDF4", color:"#15803D" }}>
                    {editing
                      ? (computeKms() !== null ? <strong>{computeKms()}</strong> : <span style={{ color:"#CBD5E1" }}>Auto</span>)
                      : (trip.totalKms ? <strong>{trip.totalKms}</strong> : <span style={{ color:"#CBD5E1" }}>—</span>)}
                  </div>
                  {/* Total Time */}
                  <div style={TS.td}>
                    {editing
                      ? <input style={TS.tdInp} value={form.totalTime} onChange={e=>fSet("totalTime",e.target.value)} placeholder="e.g. 7.15 Hours"/>
                      : trip.totalTime || <span style={{ color:"#CBD5E1" }}>—</span>}
                  </div>
                  {/* Remarks */}
                  <div style={{ ...TS.td, textAlign:"left" }}>
                    {editing
                      ? <input style={TS.tdInp} value={form.remarks} onChange={e=>fSet("remarks",e.target.value)} placeholder="Remarks…"/>
                      : trip.remarks || <span style={{ color:"#CBD5E1" }}>—</span>}
                  </div>
                </div>

                {/* Signature row */}
                <div style={TS.sigRow}>
                  <div style={TS.sigCell}>
                    <div style={{ fontSize:10, fontWeight:700, color:"#1A2C42", marginBottom:8 }}>DRIVER'S SIGNATURE</div>
                    <div style={{ fontSize:14, fontStyle:"italic", color:"#374151", borderBottom:"1px solid #CBD5E1", paddingBottom:6 }}>{driver.name}</div>
                  </div>
                  <div style={{ ...TS.sigCell, borderLeft:"2px solid #1A2C42" }}>
                    <div style={{ fontSize:10, fontWeight:700, color:"#1A2C42", marginBottom:8 }}>PASSENGER SIGNATURE</div>
                    <div style={{ height:24, borderBottom:"1px solid #CBD5E1" }}/>
                  </div>
                </div>
              </div>

              {/* Scanned Document Upload Section */}
              <div style={{ margin:"0 20px 20px", padding:"18px 20px", background:"#F8FAFC", border:"1px solid #E2E8F0", borderRadius:10 }}>
                <div style={{ fontSize:14, fontWeight:700, color:"#0F1C2E", marginBottom:12, display:"flex", alignItems:"center", gap:8 }}>
                  <Icon n="doc" size={16} color="#2E7CF6"/>
                  Scanned Trip Sheet Document
                </div>

                {existingScan ? (
                  <div style={{ display:"flex", alignItems:"center", gap:12, background:"#EFF6FF", border:"1px solid #BFDBFE", borderRadius:8, padding:"12px 16px", marginBottom:12 }}>
                    <Icon n="check" size={18} color="#10B981"/>
                    <div style={{ flex:1 }}>
                      <div style={{ fontSize:13, fontWeight:700, color:"#0F1C2E" }}>{existingScan.fileName}</div>
                      <div style={{ fontSize:11, color:"#64748B" }}>Uploaded {fmtDate(existingScan.uploadDate)} by {existingScan.uploadedBy} · Visible to Admin</div>
                    </div>
                    <button style={{ ...C.btn("ghost"), padding:"5px 12px", fontSize:12 }} onClick={() => setViewScan(existingScan)}>
                      <Icon n="eye" size={13} color="#2E7CF6"/> View
                    </button>
                  </div>
                ) : (
                  <div style={{ background:"#FFF7ED", border:"1px solid #FED7AA", borderRadius:8, padding:"10px 14px", marginBottom:12, fontSize:12, color:"#92400E" }}>
                    No scan uploaded yet. Please upload a photo or PDF of the signed physical trip sheet.
                  </div>
                )}

                <div style={{ border:"2px dashed #CBD5E1", borderRadius:8, padding:"16px", textAlign:"center", background:"#fff" }}>
                  <input type="file" accept=".pdf,.jpg,.jpeg,.png,.webp" id="tripScanInput" style={{ display:"none" }}
                    onChange={handleScanUpload}
                  />
                  <label htmlFor="tripScanInput" style={{ ...C.btn("ghost"), cursor:"pointer", display:"inline-flex" }}>
                    <Icon n="download" size={14} color="#2E7CF6"/>
                    {scanUploading ? "Reading file…" : scanFile.fileData ? "Replace File" : existingScan ? "Upload New Scan" : "Upload Scanned Document"}
                  </label>
                  <div style={{ fontSize:11, color:"#94A3B8", marginTop:6 }}>Supports PDF, JPG, PNG, WEBP · This will be visible to Admin</div>
                  {scanFile.fileData && !scanUploading && (
                    <div style={{ marginTop:10, display:"flex", alignItems:"center", justifyContent:"center", gap:8 }}>
                      <Icon n="check" size={14} color="#10B981"/>
                      <span style={{ fontSize:12, color:"#10B981", fontWeight:600 }}>{scanFile.fileName} — ready to upload</span>
                      <button style={C.btn("primary")} onClick={saveScan}>
                        <Icon n="check" size={13} color="#fff"/> Save Scan
                      </button>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}
        </>
      ) : (
        !showNewForm && (
          <div style={{ ...C.tableWrap, padding:40, textAlign:"center" }}>
            <Icon n="trip" size={36} color="#CBD5E1"/>
            <div style={{ marginTop:12, color:"#94A3B8", fontSize:14 }}>No trip sheets yet. Click <strong>New Trip Sheet</strong> above to create one.</div>
          </div>
        )
      )}

      {viewScan && <DocViewerModal doc={viewScan} onClose={() => setViewScan(null)}/>}
    </div>
  );
}

// ─── Driver Portal ─────────────────────────────────────────────────────────────
function DriverPortal({ user, drivers, vehicles, trips, setTrips, docs, setDocs }) {
  const driver = drivers.find(d => d.id === user.driverId);
  const vehicle = vehicles.find(v => v.id === driver?.vehicleId);
  const myTrips = trips.filter(t => t.driverId === driver?.id).sort((a,b) => b.date.localeCompare(a.date));
  const [page, setPage] = useState("home");
  const [issueText, setIssueText] = useState("");
  const [issueModal, setIssueModal] = useState(false);
  const [scanModal, setScanModal] = useState(null); // tripId being uploaded
  const [scanFile, setScanFile] = useState({ fileData:"", fileName:"" });
  const [scanUploading, setScanUploading] = useState(false);

  const updateTripStatus = (id, status) => setTrips(p => p.map(t => t.id===id ? {...t,status} : t));

  if (!driver) return <div style={C.emptyState}>Driver profile not found.</div>;

  const navItems = [
    { key:"home", icon:"dashboard", label:"My Dashboard" },
    { key:"trips", icon:"trip", label:"My Trips" },
    { key:"tripsheet", icon:"doc", label:"Trip Sheet" },
    { key:"documents", icon:"doc", label:"Documents" },
    { key:"vehicle", icon:"vehicle", label:"My Vehicle" },
    { key:"profile", icon:"driver", label:"My Profile" },
  ];

  return (
    <div style={C.app}>
      <div style={C.sidebar}>
        <div style={C.sidebarTop}>
          <p style={C.logo}>Travel Desk</p>
          <p style={C.logoSub}>Driver Portal</p>
        </div>
        <nav style={C.nav}>
          {navItems.map(item => (
            <div key={item.key} style={C.navItem(page===item.key)} onClick={() => setPage(item.key)}>
              <Icon n={item.icon} size={17} color={page===item.key?"#fff":"#94A3B8"}/>
              {item.label}
            </div>
          ))}
        </nav>
      </div>
      <div style={C.main}>
        <div style={C.topbar}>
          <div>
            <h1 style={C.pageTitle}>Welcome, {driver.name}</h1>
            <span style={{ fontSize:12, color:"#64748B" }}>{driver.empId} • <Badge status={driver.status}/></span>
          </div>
          <button style={{ ...C.iconBtn, color:"#64748B", fontSize:13, gap:4 }} onClick={() => window.location.reload()}>
            <Icon n="logout" size={16} color="#64748B"/> Logout
          </button>
        </div>
        <div style={C.content}>

          {page === "home" && (
            <div>
              <div style={C.statsGrid}>
                <Stat label="Total Trips" value={myTrips.length} accent="#2E7CF6"/>
                <Stat label="Active" value={myTrips.filter(t=>t.status==="Trip Started").length} accent="#10B981"/>
                <Stat label="Upcoming" value={myTrips.filter(t=>["Approved","Vehicle Assigned","Driver Assigned"].includes(t.status)).length} accent="#F59E0B"/>
                <Stat label="Completed" value={myTrips.filter(t=>t.status==="Trip Completed").length} accent="#8B5CF6"/>
              </div>
              {vehicle && (
                <div style={{ ...C.tableWrap, padding:"16px 20px", marginBottom:16 }}>
                  <div style={{ fontSize:13, fontWeight:700, color:"#0F1C2E", marginBottom:10 }}>Assigned Vehicle</div>
                  <div style={{ display:"flex", gap:24, flexWrap:"wrap" }}>
                    <div><span style={{ fontSize:11, color:"#64748B" }}>Number</span><div style={{ fontWeight:700, color:"#2E7CF6" }}>{vehicle.number}</div></div>
                    <div><span style={{ fontSize:11, color:"#64748B" }}>Type</span><div style={{ fontWeight:600 }}>{vehicle.type}</div></div>
                    <div><span style={{ fontSize:11, color:"#64748B" }}>Make / Model</span><div style={{ fontWeight:600 }}>{vehicle.make} {vehicle.model}</div></div>
                    <div><span style={{ fontSize:11, color:"#64748B" }}>Capacity</span><div style={{ fontWeight:600 }}>{vehicle.capacity} seats</div></div>
                    <div><span style={{ fontSize:11, color:"#64748B" }}>Status</span><div><Badge status={vehicle.status}/></div></div>
                  </div>
                </div>
              )}
              {/* Active trip */}
              {myTrips.filter(t=>t.status==="Trip Started").map(t => (
                <div key={t.id} style={{ background:"#EFF6FF", border:"2px solid #BFDBFE", borderRadius:10, padding:"16px 20px", marginBottom:12 }}>
                  <div style={{ fontWeight:700, color:"#1D4ED8", marginBottom:8 }}>🚗 Active Trip — Sheet #{t.sheetNo || t.id}</div>
                  <div style={{ fontSize:13, color:"#374151" }}>{t.pickup} → {t.destination}</div>
                  <div style={{ fontSize:12, color:"#64748B", marginTop:4 }}>{fmtDate(t.date)} • {t.startTime} start • Passenger: {t.passengerName || "—"}</div>
                  <button style={{ ...C.btn("success"), marginTop:10 }} onClick={() => updateTripStatus(t.id,"Trip Completed")}><Icon n="check" size={14} color="#fff"/> End Trip</button>
                </div>
              ))}
              <button style={{ ...C.btn("warn"), marginTop:8 }} onClick={() => setIssueModal(true)}><Icon n="warn" size={14} color="#fff"/> Report Vehicle Issue</button>
            </div>
          )}

          {page === "trips" && (
            <div style={C.tableWrap}>
              <div style={C.tableHeader}><span style={C.tableTitle}>My Trip Sheets</span></div>
              <table style={C.table}>
                <thead><tr>{["Sheet No.","Date","Passenger","Route","Start KMS","Close KMS","Total KMS","Status","Action"].map(h=><th key={h} style={C.th}>{h}</th>)}</tr></thead>
                <tbody>
                  {myTrips.length===0 && <tr><td colSpan={9} style={{ ...C.td, textAlign:"center", color:"#94A3B8" }}>No trip sheets assigned yet</td></tr>}
                  {myTrips.map(t => {
                    const hasScan = docs.some(d => d.tripId === t.id && d.type === "Trip Sheet Scan");
                    return (
                      <tr key={t.id}>
                        <td style={C.td}><span style={{ fontFamily:"monospace", fontSize:12, color:"#2E7CF6", fontWeight:700 }}>{t.sheetNo || t.id}</span></td>
                        <td style={C.td}>{fmtDate(t.date)}<br/><span style={{ fontSize:11, color:"#64748B" }}>{t.startTime} – {t.closeTime}</span></td>
                        <td style={C.td}>{t.passengerName || "—"}</td>
                        <td style={C.td}><span style={{ fontSize:12 }}>{t.pickup}<br/>→ {t.destination}</span></td>
                        <td style={C.td}>{t.startKms || "—"}</td>
                        <td style={C.td}>{t.closeKms || "—"}</td>
                        <td style={C.td}><strong style={{ color:"#15803D" }}>{t.totalKms || "—"}</strong></td>
                        <td style={C.td}><Badge status={t.status}/></td>
                        <td style={C.td}>
                          <div style={{ display:"flex", flexDirection:"column", gap:4 }}>
                            {t.status==="Approved" && <button style={{ ...C.btn("primary"), padding:"4px 10px", fontSize:11 }} onClick={() => updateTripStatus(t.id,"Trip Started")}>Start Trip</button>}
                            {t.status==="Trip Started" && <button style={{ ...C.btn("success"), padding:"4px 10px", fontSize:11 }} onClick={() => updateTripStatus(t.id,"Trip Completed")}>End Trip</button>}
                            <button style={{ ...C.btn(hasScan?"ghost":"warn"), padding:"4px 10px", fontSize:11 }} onClick={() => { setScanFile({fileData:"",fileName:""}); setScanModal(t.id); }}>
                              <Icon n={hasScan?"doc":"download"} size={12} color={hasScan?"#2E7CF6":"#fff"}/>
                              {hasScan ? "Replace Scan" : "Upload Scan"}
                            </button>
                          </div>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}

          {page === "tripsheet" && <DriverTripSheetForm driver={driver} vehicle={vehicle} trips={myTrips} setTrips={setTrips} docs={docs} setDocs={setDocs}/>}

          {page === "documents" && <DriverDocumentsView docs={docs} vehicles={vehicles} assignedVehicleId={driver?.vehicleId}/>}

          {page === "vehicle" && vehicle && (
            <div>
              <div style={{ ...C.tableWrap, padding:"20px 24px", marginBottom:16 }}>
                <div style={{ fontSize:15, fontWeight:700, marginBottom:16 }}>Vehicle Details — {vehicle.number}</div>
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:14 }}>
                  {[["Type",vehicle.type],["Make",vehicle.make],["Model",vehicle.model],["Capacity",`${vehicle.capacity} seats`],["Fuel",vehicle.fuel],["Owner",vehicle.owner],["Status",vehicle.status]].map(([l,v]) => (
                    <div key={l}>
                      <div style={{ fontSize:11, color:"#64748B" }}>{l}</div>
                      <div style={{ fontWeight:600, marginTop:2 }}>{l==="Status"?<Badge status={v}/>:v}</div>
                    </div>
                  ))}
                </div>
              </div>
              <div style={{ ...C.tableWrap, padding:"20px 24px" }}>
                <div style={{ fontSize:15, fontWeight:700, marginBottom:16 }}>Document Expiry Status</div>
                {[["Insurance",vehicle.insuranceExpiry],["PUC",vehicle.pucExpiry],["Fitness",vehicle.fitnessExpiry],["Road Tax",vehicle.roadTaxExpiry],["Permit",vehicle.permitExpiry]].map(([l,d]) => (
                  <div key={l} style={{ display:"flex", justifyContent:"space-between", padding:"8px 0", borderBottom:"1px solid #F1F5F9" }}>
                    <span style={{ fontSize:13, color:"#374151" }}>{l}</span>
                    <span style={C.chip(statusColor(expiryStatus(d)))}>{fmtDate(d)} ({expiryStatus(d)})</span>
                  </div>
                ))}
              </div>
            </div>
          )}

          {page === "profile" && (
            <div style={{ ...C.tableWrap, padding:"24px" }}>
              <div style={{ fontSize:15, fontWeight:700, marginBottom:16 }}>My Profile</div>
              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:14 }}>
                {[["Employee ID",driver.empId],["Full Name",driver.name],["Mobile",driver.mobile],["License No.",driver.licenseNo],["License Expiry",fmtDate(driver.licenseExpiry)],["Status",driver.status],["Address",driver.address]].map(([l,v]) => (
                  <div key={l}>
                    <div style={{ fontSize:11, color:"#64748B" }}>{l}</div>
                    <div style={{ fontWeight:600, marginTop:2, fontSize:13 }}>{l==="Status"?<Badge status={v}/>:v||"—"}</div>
                  </div>
                ))}
              </div>
              {driver.licenseExpiry && daysUntil(driver.licenseExpiry) <= 60 && (
                <Alert type="warn" style={{ marginTop:16 }}>
                  Your driving license expires on {fmtDate(driver.licenseExpiry)} ({daysUntil(driver.licenseExpiry)} days). Please renew it.
                </Alert>
              )}
            </div>
          )}

        </div>
      </div>
      {scanModal && (
        <Modal title="Upload Trip Sheet Scan" onClose={() => setScanModal(null)}>
          <div style={C.form}>
            <div style={{ marginBottom:14, padding:"10px 14px", background:"#EFF6FF", borderRadius:8, fontSize:13, color:"#1D4ED8" }}>
              Trip Sheet: <strong>#{myTrips.find(t=>t.id===scanModal)?.sheetNo || scanModal}</strong>
            </div>
            <div style={{ border:"2px dashed #D1D5DB", borderRadius:8, padding:"20px 16px", textAlign:"center", background:"#F8FAFC" }}>
              <Icon n="doc" size={20} color="#94A3B8"/>
              <div style={{ fontSize:13, fontWeight:600, color:"#64748B", marginTop:6 }}>Upload Scanned Trip Sheet</div>
              <div style={{ fontSize:11, color:"#94A3B8", marginTop:2 }}>Supports PDF, JPG, PNG</div>
              <input type="file" accept=".pdf,.jpg,.jpeg,.png,.webp" id="scanFileInput" style={{ display:"none" }}
                onChange={e => {
                  const file = e.target.files[0];
                  if (!file) return;
                  setScanUploading(true);
                  const reader = new FileReader();
                  reader.onload = ev => { setScanFile({ fileData: ev.target.result, fileName: file.name }); setScanUploading(false); };
                  reader.readAsDataURL(file);
                }}
              />
              <label htmlFor="scanFileInput" style={{ ...C.btn("ghost"), cursor:"pointer", display:"inline-flex", marginTop:10 }}>
                {scanUploading ? "Reading…" : scanFile.fileData ? "Replace File" : "Choose File"}
              </label>
              {scanFile.fileData && !scanUploading && (
                <div style={{ marginTop:10, display:"flex", alignItems:"center", justifyContent:"center", gap:8 }}>
                  <Icon n="check" size={15} color="#10B981"/>
                  <span style={{ fontSize:12, color:"#10B981", fontWeight:600 }}>{scanFile.fileName}</span>
                </div>
              )}
            </div>
            <div style={{ display:"flex", gap:10, justifyContent:"flex-end", marginTop:20 }}>
              <button style={C.btn("ghost")} onClick={() => setScanModal(null)}>Cancel</button>
              <button style={C.btn("primary")} disabled={!scanFile.fileData} onClick={() => {
                if (!scanFile.fileData) return;
                const trip = myTrips.find(t => t.id === scanModal);
                const existingIdx = docs.findIndex(d => d.tripId === scanModal && d.type === "Trip Sheet Scan");
                const newDoc = {
                  id: existingIdx >= 0 ? docs[existingIdx].id : "DOC" + uid(),
                  vehicleId: vehicle?.id || "",
                  tripId: scanModal,
                  name: `Trip Sheet #${trip?.sheetNo || scanModal}`,
                  type: "Trip Sheet Scan",
                  uploadDate: today(),
                  expiryDate: "",
                  status: "Valid",
                  fileName: scanFile.fileName,
                  fileData: scanFile.fileData,
                  uploadedBy: driver.name,
                };
                if (existingIdx >= 0) {
                  setDocs(p => p.map((d,i) => i === existingIdx ? newDoc : d));
                } else {
                  setDocs(p => [...p, newDoc]);
                }
                setScanModal(null);
                setScanFile({ fileData:"", fileName:"" });
              }}>Save Scan</button>
            </div>
          </div>
        </Modal>
      )}

      {issueModal && (
        <Modal title="Report Vehicle Issue" onClose={() => setIssueModal(false)}>
          <div style={C.form}>
            <FormField label="Describe the issue">
              <textarea style={{ ...C.input, minHeight:100, resize:"vertical", width:"100%", boxSizing:"border-box" }} value={issueText} onChange={e=>setIssueText(e.target.value)} placeholder="Describe the vehicle problem or maintenance requirement…"/>
            </FormField>
            <div style={{ display:"flex", gap:10, justifyContent:"flex-end", marginTop:16 }}>
              <button style={C.btn("ghost")} onClick={() => setIssueModal(false)}>Cancel</button>
              <button style={C.btn("warn")} onClick={() => { alert(`Issue reported:\n"${issueText}"\n\nAdmin will be notified.`); setIssueText(""); setIssueModal(false); }}><Icon n="warn" size={14} color="#fff"/> Submit Report</button>
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
}

// ─── Admin Trip Scans View ─────────────────────────────────────────────────────
function AdminTripScans({ docs, trips, vehicles, drivers }) {
  const [viewDoc, setViewDoc] = useState(null);
  const [search, setSearch] = useState("");
  const [filterDriver, setFilterDriver] = useState("");

  const scans = docs.filter(d => d.type === "Trip Sheet Scan");

  const getTrip = (tripId) => trips.find(t => t.id === tripId);
  const getVehicle = (vid) => vehicles.find(v => v.id === vid);
  const getDriver = (driverId) => drivers.find(d => d.id === driverId);

  const filtered = scans.filter(d => {
    const t = getTrip(d.tripId);
    const q = search.toLowerCase();
    const matchesSearch = !q || d.name.toLowerCase().includes(q) || (t && (t.sheetNo||"").toLowerCase().includes(q)) || (t && (t.passengerName||"").toLowerCase().includes(q));
    const matchesDriver = !filterDriver || (t && t.driverId === filterDriver);
    return matchesSearch && matchesDriver;
  });

  return (
    <div>
      <div style={{ background:"#EFF6FF", border:"1px solid #BFDBFE", borderRadius:10, padding:"14px 18px", marginBottom:16, display:"flex", alignItems:"center", gap:10 }}>
        <Icon n="doc" size={18} color="#2E7CF6"/>
        <div style={{ fontSize:13, color:"#1D4ED8" }}>
          Drivers upload scanned physical trip sheets from their <strong>Trip Sheet</strong> portal page. All uploads appear here for admin review.
          <span style={{ marginLeft:8, background:"#BFDBFE", borderRadius:4, padding:"2px 8px", fontSize:12, fontWeight:700 }}>{scans.length} scan{scans.length!==1?"s":""} total</span>
        </div>
      </div>

      <div style={C.tableWrap}>
        <div style={C.tableHeader}>
          <span style={C.tableTitle}>Trip Sheet Scans ({filtered.length})</span>
        </div>
        <div style={C.filterRow}>
          <SearchBox value={search} onChange={setSearch} placeholder="Search sheet no, passenger…"/>
          <select style={{ ...C.select, minWidth:160, width:"auto" }} value={filterDriver} onChange={e=>setFilterDriver(e.target.value)}>
            <option value="">All Drivers</option>
            {drivers.map(d=><option key={d.id} value={d.id}>{d.name}</option>)}
          </select>
        </div>
        <div style={{ overflowX:"auto" }}>
          <table style={C.table}>
            <thead><tr>
              {["Sheet No.","Trip Date","Passenger","Route","Vehicle","Driver","Upload Date","Uploaded By","Scan"].map(h=><th key={h} style={C.th}>{h}</th>)}
            </tr></thead>
            <tbody>
              {filtered.length === 0 && (
                <tr><td colSpan={9} style={{ ...C.td, textAlign:"center", padding:"40px", color:"#94A3B8" }}>
                  <div><Icon n="doc" size={32} color="#CBD5E1"/></div>
                  <div style={{ marginTop:8 }}>No trip sheet scans uploaded yet.</div>
                  <div style={{ fontSize:12, marginTop:4 }}>Drivers can upload scans from their Trip Sheet page.</div>
                </td></tr>
              )}
              {filtered.map(d => {
                const t = getTrip(d.tripId);
                const drv = t ? getDriver(t.driverId) : null;
                const v = getVehicle(d.vehicleId);
                return (
                  <tr key={d.id}>
                    <td style={C.td}><span style={{ fontFamily:"monospace", fontSize:13, color:"#EF4444", fontWeight:800 }}>{t?.sheetNo || "—"}</span></td>
                    <td style={C.td}>{t ? fmtDate(t.date) : "—"}</td>
                    <td style={C.td}>{t?.passengerName || "—"}</td>
                    <td style={C.td}><span style={{ fontSize:12 }}>{t ? `${t.pickup} → ${t.destination}` : "—"}</span></td>
                    <td style={C.td}>{v ? <span style={{ fontWeight:600, color:"#2E7CF6" }}>{v.number}</span> : "—"}</td>
                    <td style={C.td}>{drv ? drv.name : d.uploadedBy || "—"}</td>
                    <td style={C.td}>{fmtDate(d.uploadDate)}</td>
                    <td style={C.td}>{d.uploadedBy || "—"}</td>
                    <td style={C.td}>
                      {d.fileData
                        ? <button style={{ ...C.btn("primary"), padding:"5px 12px", fontSize:12 }} onClick={() => setViewDoc(d)}>
                            <Icon n="eye" size={13} color="#fff"/> View Scan
                          </button>
                        : <span style={{ fontSize:11, color:"#F59E0B" }}>File missing</span>}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
      {viewDoc && <DocViewerModal doc={viewDoc} onClose={() => setViewDoc(null)}/>}
    </div>
  );
}

// ─── Admin Portal ──────────────────────────────────────────────────────────────
const NAV = [
  { key:"dashboard", icon:"dashboard", label:"Dashboard", section:"Overview" },
  { key:"vehicles", icon:"vehicle", label:"Vehicles", section:"Fleet" },
  { key:"documents", icon:"doc", label:"Documents", section:"Fleet" },
  { key:"tripscans", icon:"doc", label:"Trip Sheet Scans", section:"Fleet" },
  { key:"drivers", icon:"driver", label:"Drivers", section:"People" },
  { key:"reports", icon:"report", label:"Reports", section:"Analytics" },
];

function AdminPortal({ user, vehicles, setVehicles, drivers, setDrivers, trips, setTrips, docs, setDocs }) {
  const [page, setPage] = useState("dashboard");
  const [notifOpen, setNotifOpen] = useState(false);

  const alerts = useMemo(() => {
    const out = [];
    vehicles.forEach(v => {
      [["insuranceExpiry","Insurance"],["pucExpiry","PUC"],["fitnessExpiry","Fitness"],["roadTaxExpiry","Road Tax"],["permitExpiry","Permit"]].forEach(([k,label]) => {
        const days = daysUntil(v[k]);
        if (days < 0) out.push({ type:"danger", msg:`${v.number}: ${label} expired` });
        else if (days <= 30) out.push({ type:"warn", msg:`${v.number}: ${label} expires in ${days}d` });
      });
    });
    drivers.forEach(d => {
      const days = daysUntil(d.licenseExpiry);
      if (days < 0) out.push({ type:"danger", msg:`${d.name}: License expired` });
      else if (days <= 60) out.push({ type:"warn", msg:`${d.name}: License expires in ${days}d` });
    });
    return out;
  }, [vehicles, drivers]);

  const sections = [...new Set(NAV.map(n=>n.section))];
  const titles = { dashboard:"Dashboard", vehicles:"Vehicle Fleet", documents:"Document Management", tripscans:"Trip Sheet Scans", drivers:"Driver Management", reports:"Reports" };

  return (
    <div style={C.app}>
      {/* Sidebar */}
      <div style={C.sidebar}>
        <div style={C.sidebarTop}>
          <p style={C.logo}>Travel Desk</p>
          <p style={C.logoSub}>Admin Portal · GITAM</p>
        </div>
        <nav style={C.nav}>
          {sections.map(sec => (
            <div key={sec}>
              <div style={C.navSection}>{sec}</div>
              {NAV.filter(n=>n.section===sec).map(item => (
                <div key={item.key} style={C.navItem(page===item.key)} onClick={() => setPage(item.key)}>
                  <Icon n={item.icon} size={17} color={page===item.key?"#fff":"#94A3B8"}/>
                  {item.label}
                </div>
              ))}
            </div>
          ))}
        </nav>
        <div style={{ padding:"12px 16px", borderTop:"1px solid #1F3048" }}>
          <div style={{ fontSize:12, color:"#64748B" }}>Signed in as</div>
          <div style={{ fontSize:13, color:"#fff", fontWeight:600, marginTop:2 }}>{user.name}</div>
        </div>
      </div>

      {/* Main */}
      <div style={C.main}>
        <div style={C.topbar}>
          <h1 style={C.pageTitle}>{titles[page]}</h1>
          <div style={C.row}>
            {/* Bell */}
            <div style={{ position:"relative" }}>
              <button style={{ ...C.iconBtn, position:"relative" }} onClick={() => setNotifOpen(o=>!o)}>
                <Icon n="bell" size={20} color="#64748B"/>
                {alerts.length > 0 && <span style={{ position:"absolute", top:0, right:0, background:"#EF4444", color:"#fff", fontSize:9, fontWeight:700, width:14, height:14, borderRadius:99, display:"flex", alignItems:"center", justifyContent:"center" }}>{alerts.length}</span>}
              </button>
              {notifOpen && (
                <div style={{ position:"absolute", right:0, top:36, background:"#fff", border:"1px solid #E2E8F0", borderRadius:10, width:320, boxShadow:"0 8px 24px rgba(0,0,0,.12)", zIndex:200, maxHeight:400, overflowY:"auto" }}>
                  <div style={{ padding:"12px 16px", borderBottom:"1px solid #E2E8F0", fontWeight:700, fontSize:13 }}>Notifications ({alerts.length})</div>
                  {alerts.length === 0 && <div style={{ padding:16, color:"#94A3B8", fontSize:13 }}>All clear!</div>}
                  {alerts.map((a,i) => <div key={i} style={{ padding:"10px 16px", borderBottom:"1px solid #F1F5F9", display:"flex", gap:8, alignItems:"flex-start" }}>
                    <Icon n={a.type==="danger"?"warn":"warn"} size={14} color={a.type==="danger"?"#EF4444":"#F59E0B"}/>
                    <span style={{ fontSize:12, color:"#374151" }}>{a.msg}</span>
                  </div>)}
                </div>
              )}
            </div>
            <button style={{ ...C.iconBtn, fontSize:13, color:"#64748B", gap:4 }} onClick={() => window.location.reload()}>
              <Icon n="logout" size={16} color="#64748B"/> Logout
            </button>
          </div>
        </div>

        <div style={C.content}>
          {page === "dashboard" && <Dashboard vehicles={vehicles} drivers={drivers} trips={trips} docs={docs}/>}
          {page === "vehicles" && <Vehicles vehicles={vehicles} setVehicles={setVehicles} drivers={drivers}/>}
          {page === "documents" && <Documents docs={docs} setDocs={setDocs} vehicles={vehicles}/>}
          {page === "tripscans" && <AdminTripScans docs={docs} trips={trips} vehicles={vehicles} drivers={drivers}/>}
          {page === "drivers" && <Drivers drivers={drivers} setDrivers={setDrivers} vehicles={vehicles}/>}
          {page === "reports" && <Reports trips={trips} vehicles={vehicles} drivers={drivers}/>}
        </div>
      </div>
    </div>
  );
}

// ─── Root ──────────────────────────────────────────────────────────────────────
function App() {
  const [user, setUser] = useState(null);
  const [vehicles, setVehicles] = useRTDB("td_vehicles", SEED_VEHICLES);
  const [drivers, setDrivers] = useRTDB("td_drivers", SEED_DRIVERS);
  const [trips, setTrips] = useRTDB("td_trips", SEED_TRIPS);
  const [docs, setDocs] = useRTDB("td_docs", SEED_DOCS);

  // Auto-logout driver after inactivity
  useEffect(() => {
    if (!user || user.role !== "driver") return;
    let timer;
    const reset = () => {
      clearTimeout(timer);
      timer = setTimeout(() => {
        alert("You have been logged out due to inactivity (15 minutes).");
        setUser(null);
      }, INACTIVITY_MS);
    };
    const events = ["mousemove","keydown","click","touchstart"];
    events.forEach(e => window.addEventListener(e, reset));
    reset();
    return () => { clearTimeout(timer); events.forEach(e => window.removeEventListener(e, reset)); };
  }, [user]);

  const FBBanner = !FB_READY && (
    <div style={{ position:"fixed", bottom:0, left:0, right:0, background:"#1e3a5f", color:"#fff", padding:"10px 20px", fontSize:12, zIndex:9999, display:"flex", alignItems:"center", gap:12 }}>
      <Icon n="warn" size={16} color="#F59E0B"/>
      <span><strong>Firebase not configured</strong> — running on localStorage only. Open the HTML file and fill in your <code style={{background:"#0f2540",padding:"1px 5px",borderRadius:3}}>FIREBASE_CONFIG</code> to enable real-time sync &amp; multi-device support.</span>
    </div>
  );

  if (!user) return <>{FBBanner}<Login onLogin={setUser} drivers={drivers} setDrivers={setDrivers}/></>;
  if (user.role === "driver") return <>{FBBanner}<DriverPortal user={user} drivers={drivers} vehicles={vehicles} trips={trips} setTrips={setTrips} docs={docs} setDocs={setDocs}/></>;
  return <>{FBBanner}<AdminPortal user={user} vehicles={vehicles} setVehicles={setVehicles} drivers={drivers} setDrivers={setDrivers} trips={trips} setTrips={setTrips} docs={docs} setDocs={setDocs}/></>;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
